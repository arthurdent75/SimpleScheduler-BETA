version: "4.0.0"
name: Simple Scheduler (BETA)
description: Simple timer on weekly base
slug: simplescheduler
url: https://github.com/arthurdent75/SimpleScheduler-BETA
image: ghcr.io/arthurdent75/simplescheduler-beta  
codenotary: notary@home-assistant.io
arch:
  - aarch64
  - amd64
init: false
homeassistant_api: true
ingress: true
panel_admin: false
panel_title: Scheduler
panel_icon: mdi:calendar-clock
services:
  - mqtt:need 
map:
  - addon_config:rw
  - share:rw
options: {}
schema:
  mqtt_host: str?
  mqtt_port: port?
  mqtt_username: str?
  mqtt_password: password?

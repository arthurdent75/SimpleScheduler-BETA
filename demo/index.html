}

/* ---------- view-specific part: timeline, badges, input card, text ---------- */
function renderEditorView(){
  refreshNow();
  const d = ed.draft;
  if (d.type === 'recurring'){
    try { syncRuleFromForm(); } catch (err) { /* invalid script parameters: shown when saving */ }
    d.entries = generateRecurring(d.rule);
  }
  const domains = domainsOf(d.entities);
  const view = document.getElementById('ed-view');
  let html = '';

  if (d.type === 'weekly'){
    html += '<div class="card"><h3>Week <span class="sub">Tap a day to edit it</span>' +
        '<span class="right tl-tools">' + zoomButtonsHTML() + '</span></h3>' +
      weekTimelineHTML(d.entries, domains) +
      '<p class="tl-hint">Tap a time label to edit that event. On the selected day, tap the bar to add an event at that time.</p></div>';
  }

  if (d.type === 'recurring'){
    const r = d.rule;
    const maxDur = Math.max(1, Math.min(240, r.every - 1));
    html += '<div class="card"><h3>Repeat rule</h3><div class="rule-grid">' +
      '<div class="field"><label for="r-from">From</label><input type="time" class="input" id="r-from" value="' + r.from + '"></div>' +
      '<div class="field"><label for="r-to">To</label><input type="time" class="input" id="r-to" value="' + r.to + '"></div>' +
      '<div class="field"><label for="r-every">Every (minutes)</label><input type="number" min="2" max="720" step="1" class="input" id="r-every" value="' + r.every + '"></div>' +
      '</div>' +
      '<div class="field" style="margin-top:14px"><span class="flabel">Action</span><div class="seg-ctl" id="r-mode">' +
        [['on','Turn on'],['off','Turn off'],['pulse','Turn on, then off']].map(([v,l]) => '<button data-v="' + v + '" aria-pressed="' + (r.action === v) + '">' + l + '</button>').join('') + '</div></div>' +
      (r.action === 'pulse' ? '<div class="feat" style="margin-top:12px"><div class="fname">Stay on for</div><div class="ctl"><input type="range" min="1" max="' + maxDur + '" value="' + Math.min(r.duration, maxDur) + '" id="r-dur"><span class="val" id="r-dur-v">' + Math.min(r.duration, maxDur) + ' min</span></div></div>' : '') +
      '<div class="field" style="margin-top:14px"><span class="flabel">Days</span>' + daysPickerHTML(r.weekdays, 'r-days') + '</div>' +
      '<div style="margin-top:14px;display:grid;gap:14px" id="rec-extras">' +
        conditionChoiceHTML(ed.form) +
        forceHTML(domains, ed.form) +
        extrasHTML(domains, r.action === 'off' ? 'off' : 'on', ed.form, r.action === 'pulse' ? 'Applied when it turns on.' : '') +
      '</div>' +
      (toMin(r.to) < toMin(r.from) ? '<p class="err">“To” must be later than “From”.</p>' : '') +
      '</div>';
  }

  if (d.type !== 'weekly'){
    html += '<div class="card"><h3>Day view' +
        '<span class="right tl-tools">' +
          '<select class="input" id="tl-day" style="width:auto;padding:5px 8px" aria-label="Day to preview">' + WD_LONG.map((n,i) => '<option value="' + (i+1) + '"' + (ed.day === i+1 ? ' selected' : '') + '>' + n + (i+1 === NOW.day ? ' (today)' : '') + '</option>').join('') + '</select>' +
          zoomButtonsHTML() +
        '</span></h3>' +
        timelineHTML(d.entries, ed.day, domains) +
        '<p class="tl-hint">' + (d.type === 'recurring' ? 'Events are generated from the repeat rule.' : 'Tap the bar to add an event at that time. Tap a label to edit it.') + '</p>' +
      '</div>';
  }

  const shown = d.type === 'weekly' ? d.entries.filter(e => e.weekdays === String(ed.day)) : d.entries;
  const sorted = [...shown].sort((a,b) => minuteOf(a.time) - minuteOf(b.time));
  html += '<div class="card"><h3>Events' + (d.type === 'weekly' ? ' on ' + WD_LONG[ed.day-1] : '') + ' <span class="sub">' + sorted.length + (sorted.length === 1 ? ' event' : ' events') + '</span></h3>' +
    (sorted.length ? '<div class="badges">' + sorted.map(e => badgeHTML(e, domains, d.type)).join('') + '</div>' : '<p class="badges-empty">No events yet. Add the first one below.</p>');
  if (d.type === 'weekly'){
    html += '<div class="copy-tools">Copy ' + WD[ed.day-1] + ' to <button class="btn small" data-copy="12345">Mon–Fri</button><button class="btn small" data-copy="67">Weekends</button><button class="btn small" data-copy="1234567">All days</button></div>';
  }
  if (d.type !== 'recurring') html += inputCardHTML(domains);
  html += '</div>';

  html += '<div class="card"><h3>As text</h3>' +
    '<div class="tabs" role="tablist"><button role="tab" data-tab="preview" aria-selected="' + (ed.textTab === 'preview') + '">Preview</button><button role="tab" data-tab="manual" aria-selected="' + (ed.textTab === 'manual') + '">Manual edit</button></div>';
  if (ed.textTab === 'preview'){
    html += dayLinesHTML(d.entries, domains);
  } else {
    const text = ed.manualText !== null ? ed.manualText : serializeDraft();
    html += '<textarea class="input" id="manual" rows="8" spellcheck="false">' + esc(text) + '</textarea>' +
      (ed.manualErr ? '<p class="err">' + esc(ed.manualErr) + '</p>' : '') +
      '<div class="card-actions" style="margin-top:10px"><button class="btn" id="manual-reset">Reset</button><button class="btn primary" id="manual-apply">Apply text</button></div>' +
      (d.type === 'recurring'
        ? '<p class="syntax">One line: <code>every 60 from 06:00 to 20:00 pulse 10 days 135</code>. The action is <code>on</code>, <code>off</code> or <code>pulse</code> followed by the minutes to stay on.<br>' +
          'Optional settings at the end, as for events: <code>B30</code> <code>C#FF9900</code> <code>K4700</code> <code>P50</code> <code>F25</code> <code>Mcool</code> <code>T21.5</code> <code>H55</code><code>J{…}</code> (not with <code>off</code>), <code>if:false</code> run when the condition is false, <code>force</code> force the state until the next event.</p>'
        : '<p class="syntax">One event per line: action, time, weekdays (1 = Mon … 7 = Sun), then optional settings.<br>' +
          'Time: <code>07:30</code> <code>sunrise</code> <code>sunset-30</code>. Settings: <code>B30</code> brightness %, <code>BA200</code> absolute brightness, <code>C#FF9900</code> color, <code>K4700</code> color temperature, <code>P50</code> position, <code>F25</code> fan, <code>Mcool</code> climate mode (heat, cool, heat_cool, auto, dry, fan_only), <code>T21.5</code> temperature, <code>TO20</code> temperature only,<code>H55</code> humidity, <code>J{…}</code> script parameters (last), <code>if:false</code> run when the condition is false, <code>force</code> force the state until the next event.</p>');
  }
  html += '</div>';
  view.innerHTML = html;

  const sc = view.querySelector('.tl-scroll');
  if (sc && ed.zoom > 1){
    const sel = ed.editingId && d.entries.find(e => e.id === ed.editingId);
    const target = sel ? minuteOf(sel.time) : (ed.day === NOW.day ? NOW.minute : 420);
    sc.scrollLeft = (target / 1440) * sc.scrollWidth - sc.clientWidth / 2;
  }
}

function zoomButtonsHTML(){
  return '<button class="icon-btn" id="zoom-out" aria-label="Zoom out"' + (ed.zoom === 1 ? ' disabled style="opacity:.35"' : '') + '>' + ICON.zoomOut + '</button>' +
         '<button class="icon-btn" id="zoom-in" aria-label="Zoom in"' + (ed.zoom === 6 ? ' disabled style="opacity:.35"' : '') + '>' + ICON.zoomIn + '</button>';
}

function daysPickerHTML(days, id){
  return '<div class="row" style="gap:6px;align-items:center"><div class="days" id="' + id + '">' +
    WD.map((n,i) => '<button data-d="' + (i+1) + '" aria-pressed="' + days.includes(String(i+1)) + '">' + n + '</button>').join('') + '</div>' +
    '<div class="days-quick"><button class="btn small ghost" data-preset="1234567" data-for="' + id + '">All</button><button class="btn small ghost" data-preset="12345" data-for="' + id + '">Mon–Fri</button><button class="btn small ghost" data-preset="67" data-for="' + id + '">Weekend</button></div></div>';
}

function badgeHTML(e, domains, type){
  const ro = type === 'recurring';
  const ex = e.action === 'on' ? extraHTML(e.extra) : '';
  return '<span class="badge ' + e.action + (ed.editingId === e.id ? ' sel' : '') + (ro ? ' ro' : '') + '" ' + (ro ? '' : 'data-sel="' + e.id + '" tabindex="0" role="button"') + ' aria-label="' + actionWord(e.action, domains) + ' at ' + esc(timeToken(e.time)) + '">' +
    '<span class="act">' + actionWord(e.action, domains) + '</span>' +
    '<span class="tm">' + timeHTML(e.time) + '</span>' +
    (ex ? '<span class="ex">' + ex + '</span>' : '') +
    (type === 'daily' && e.weekdays !== '1234567' ? '<span class="wd">' + daysSummary(e.weekdays) + '</span>' : '') +
    (e.if_condition === false ? '<span class="if-false">if false</span>' : '') +
    (e.force ? '<span class="force" title="Forced until the next event">' + ICON.lock + '</span>' : '') +
    (ro ? '' : '<button class="x" data-del="' + e.id + '" aria-label="Delete event">' + ICON.x + '</button>') +
    '</span>';
}

/* Labels near midnight are aligned to the edge instead of centred, so they stay inside the timeline */
function edgeClass(min, zoom){
  const margin = 60 / zoom;
  return min < margin ? ' edge-l' : min > 1440 - margin ? ' edge-r' : '';
}

function timelineHTML(entries, day, domains){
  const events = eventsForDay(entries, day);
  const z = ed.zoom;
  let html = '<div class="tl-scroll"><div class="tl-inner" style="width:' + (z*100) + '%">';
  const labelStep = z === 1 ? 3 : z === 2 ? 2 : 1;
  for (let h = 0; h <= 24; h++){
    // the 24:00 line would sit on the border and overflow by 1px
    if (h < 24) html += '<div class="tl-hour" style="left:' + (h/24*100) + '%"></div>';
    if (h % labelStep === 0) html += '<div class="tl-hlabel' + (h === 0 ? ' edge-l' : h === 24 ? ' edge-r' : '') + '" style="left:' + (h/24*100) + '%">' + String(h).padStart(2,'0') + ':00</div>';
    if (z >= 4 && h < 24) html += '<div class="tl-hour minor" style="left:' + ((h+0.5)/24*100) + '%"></div>';
  }
  for (const k of ['sunrise','sunset']){
    html += '<div class="tl-sun ' + (k === 'sunrise' ? 'rise' : 'set') + '" style="left:' + (toMin(sunTime(k))/14.4) + '%"><span style="bottom:24px">' + ICON[k] + sunTime(k) + '</span></div>';
  }
  html += '<div class="tl-track" id="tl-track">';
  const bands = bandsForDay(entries, day);
  if (!events.length) html += '<div class="noevents">No events on this day</div>';
  for (const s of bands) html += '<div class="seg ' + s.state + '" style="left:' + (s.from/14.4) + '%;width:' + ((s.to-s.from)/14.4) + '%"></div>';
  html += '</div>';
  const minGap = 95 / z;
  const laneEnd = [-9999, -9999, -9999, -9999];
  for (const ev of events){
    let lane = laneEnd.findIndex(end => ev.min - end >= minGap);
    if (lane < 0) lane = laneEnd.indexOf(Math.min(...laneEnd));
    laneEnd[lane] = ev.min;
    const label = ev.entry.time.kind === 'clock' ? ev.entry.time.value : toHHMM(ev.min);
    html += '<div class="tl-pin ' + ev.action + edgeClass(ev.min, z) + (ed.editingId === ev.entry.id ? ' sel' : '') + (ev.entry.if_condition === false ? ' alt' : '') + '" style="left:' + (ev.min/14.4) + '%">' +
      '<div class="stem" style="top:' + (8 + lane*22 + 16) + 'px"></div>' +
      '<button style="top:' + (8 + lane*22) + 'px" ' + (ed.draft.type === 'recurring' ? 'tabindex="-1"' : 'data-sel="' + ev.entry.id + '"') + ' title="' + actionWord(ev.action, domains) + ' at ' + esc(timeToken(ev.entry.time)) + (ev.entry.if_condition === false ? ' if the condition is false' : '') + '">' +
        (ev.entry.time.kind !== 'clock' ? (ev.entry.time.kind === 'sunrise' ? '↑' : '↓') : '') + label + '</button></div>';
  }
  if (day === NOW.day) html += '<div class="tl-now" style="left:' + (NOW.minute/14.4) + '%" title="Now"></div>';
  return html + '</div></div>';
}

function weekTimelineHTML(entries, domains){
  const z = ed.zoom;
  const labelStep = z === 1 ? 3 : z === 2 ? 2 : 1;
  const minGap = 80 / z;
  let labels = '', rows = '', grid = '';
  for (let day = 1; day <= 7; day++){
    const sel = day === ed.day;
    labels += '<button class="wk-lab' + (sel ? ' sel' : '') + '" data-wkday="' + day + '" aria-pressed="' + sel + '">' + WD[day-1] + '</button>';
    const events = eventsForDay(entries, day);
    let row = '<div class="wk-row' + (sel ? ' sel' : '') + '" data-wkday="' + day + '"><div class="wk-track"' + (sel ? ' id="tl-track"' : '') + '>';
    for (const s of bandsForDay(entries, day)) row += '<div class="seg ' + s.state + '" style="left:' + (s.from/14.4) + '%;width:' + ((s.to-s.from)/14.4) + '%"></div>';
    row += '</div>';
    const laneEnd = [-9999, -9999];
    for (const ev of events){
      let lane = laneEnd.findIndex(end => ev.min - end >= minGap);
      if (lane < 0) lane = laneEnd[0] <= laneEnd[1] ? 0 : 1;
      laneEnd[lane] = ev.min;
      row += '<button class="wk-pin ' + ev.action + edgeClass(ev.min, z) + (ed.editingId === ev.entry.id ? ' sel' : '') + (ev.entry.if_condition === false ? ' alt' : '') + '" data-sel="' + ev.entry.id + '" style="left:' + (ev.min/14.4) + '%;top:' + (3 + lane*15) + 'px" title="' + actionWord(ev.action, domains) + ' at ' + esc(timeToken(ev.entry.time)) + '">' +
        (ev.entry.time.kind !== 'clock' ? (ev.entry.time.kind === 'sunrise' ? '↑' : '↓') : '') + toHHMM(ev.min) + '</button>';
    }
    if (day === NOW.day) row += '<div class="wk-now" style="left:' + (NOW.minute/14.4) + '%" title="Now"></div>';
    rows += row + '</div>';
  }
  for (let h = 0; h <= 24; h++){
    // the 24:00 line would sit on the border and overflow by 1px
    if (h < 24) grid += '<div class="tl-hour" style="left:' + (h/24*100) + '%"></div>';
    if (h % labelStep === 0) grid += '<div class="tl-hlabel' + (h === 0 ? ' edge-l' : h === 24 ? ' edge-r' : '') + '" style="left:' + (h/24*100) + '%">' + String(h).padStart(2,'0') + ':00</div>';
  }
  for (const k of ['sunrise','sunset']) grid += '<div class="tl-sun ' + (k === 'sunrise' ? 'rise' : 'set') + '" style="left:' + (toMin(sunTime(k))/14.4) + '%" title="' + (k === 'sunrise' ? 'Sunrise ' : 'Sunset ') + sunTime(k) + '"></div>';
  return '<div class="wk-wrap"><div class="wk-labels">' + labels + '</div><div class="tl-scroll wk-scroll"><div class="wk-inner" style="width:' + (z*100) + '%">' + rows + grid + '</div></div></div>';
}

function inputCardHTML(domains){
  const f = ed.form, d = ed.draft;
  const editing = !!ed.editingId;
  let html = '<div class="inputcard' + (editing ? ' editing' : '') + '" id="inputcard">' +
    '<div class="head">' + (editing ? 'Edit event' : 'New event') + (editing ? '<button class="btn small ghost" id="ev-cancel">Cancel editing</button>' : '') + '</div>' +
    '<div class="row">' +
      '<div class="field"><span class="flabel">Action</span><div class="seg-ctl action" id="f-action">' +
        '<button data-v="on" aria-pressed="' + (f.action === 'on') + '">' + actionWord('on', domains) + '</button>' +
        '<button data-v="off" aria-pressed="' + (f.action === 'off') + '">' + actionWord('off', domains) + '</button></div></div>' +
      '<div class="field"><span class="flabel">When</span><div class="seg-ctl" id="f-mode">' +
        '<button data-v="clock" aria-pressed="' + (f.mode === 'clock') + '">' + ICON.clock + 'Time</button>' +
        '<button data-v="sunrise" aria-pressed="' + (f.mode === 'sunrise') + '">' + ICON.sunrise + 'Sunrise</button>' +
        '<button data-v="sunset" aria-pressed="' + (f.mode === 'sunset') + '">' + ICON.sunset + 'Sunset</button></div></div>' +
    '</div>';
  if (f.mode === 'clock'){
    html += '<div class="field"><label for="f-time">Time</label><input type="time" class="input" id="f-time" value="' + f.time + '"></div>';
  } else {
    html += '<div class="field"><label for="f-off">Offset from ' + f.mode + ' (' + sunTime(f.mode) + ' today)</label>' +
      '<div class="offset-ctl"><div class="offset-slider' + (f.offset === 0 ? ' at-zero' : '') + '"><input type="range" id="f-off" min="-180" max="180" step="5" value="' + f.offset + '"><span class="zero-tick" aria-hidden="true"></span></div><span class="offset-val" id="f-off-v">' + offsetText(f.offset, f.mode) + '</span></div></div>';
  }
  if (d.type === 'daily') html += '<div class="field"><span class="flabel">Days</span>' + daysPickerHTML(f.days, 'f-days') + '</div>';
  html += conditionChoiceHTML(f) + forceHTML(domains, f) + extrasHTML(domains, f.action, f, '');
  html += '<div class="card-actions"><span class="err" id="ev-err"></span>' +
    '<button class="btn primary" id="ev-add">' + (editing ? 'Update event' : 'Add event') + '</button></div></div>';
  return html;
}

/* Shared by the input card and the recurring rule */
function canForce(domains){ return domains.some(dm => FORCE_DOMAINS.includes(dm)); }
function forceHTML(domains, f){
  if (!canForce(domains)) return '';
  return '<label class="checkline"><input type="checkbox" id="f-force"' + (f.force ? ' checked' : '') + '>' + ICON.lock +
    'Force this state until the next event <small class="muted">checked every minute</small></label>';
}
function conditionChoiceHTML(f){
  if (!ed.draft.condition.trim()) return '';
  return '<div class="field"><span class="flabel">Run when the condition is</span><div class="seg-ctl" id="f-when">' +
    '<button data-v="true" aria-pressed="' + f.ifCondition + '">True</button><button data-v="false" aria-pressed="' + !f.ifCondition + '">False</button></div></div>';
}
function extrasHTML(domains, action, f, note){
  const feats = [...new Set(domains.flatMap(dm => FEATURES_BY_DOMAIN[dm] || []))];
  if (!feats.length) return '';
  let html = '<div class="extras"><span class="flabel">Extra settings</span>';
  if (action === 'off') html += '<span class="note">Extra settings apply to ' + actionWord('on', domains) + ' events only.</span>';
  else {
    if (note) html += '<span class="note">' + esc(note) + '</span>';
    for (const k of feats) html += featureHTML(k, f.f[k], f);
  }
  return html + '</div>';
}

function offsetText(off, mode){
  const at = toHHMM(toMin(sunTime(mode)) + off);
  if (!off) return 'at ' + at;
  return (off > 0 ? '+' : '−') + Math.abs(off) + ' min (' + at + ')';
}

/* Modes supported by every selected climate (from its hvac_modes attribute). When Home Assistant
   gives no list, or the climates have no mode in common, every standard mode is offered */
function hvacModesFor(entityIds){
  const lists = entityIds.filter(id => id.startsWith('climate.'))
    .map(id => (app.entities.find(e => e.id === id) || {}).hvac_modes).filter(Array.isArray);
  const common = HVAC_MODES.filter(m => lists.every(l => l.includes(m)));
  return lists.length && common.length ? common : HVAC_MODES.slice();
}

function featureHTML(k, s, f){
  const sw = '<label class="switch"><input type="checkbox" data-feat-on="' + k + '"' + (s.on ? ' checked' : '') + ' aria-label="Use this setting"><span class="knob"></span></label>';
  const wrap = (name, hint, ctl) => '<div class="feat' + (s.on ? '' : ' off') + '"><div class="fname">' + sw + name + (hint ? ' <small>' + hint + '</small>' : '') + '</div><div></div><div class="ctl">' + ctl + '</div></div>';
  if (k === 'brightness'){
    const max = s.mode === 'abs' ? 255 : 100;
    return wrap('Brightness', '', '<div class="seg-ctl" data-bri-mode><button data-v="pct" aria-pressed="' + (s.mode === 'pct') + '">Percent</button><button data-v="abs" aria-pressed="' + (s.mode === 'abs') + '">0–255</button></div>' +
      '<input type="range" min="1" max="' + max + '" value="' + Math.min(s.value, max) + '" data-feat="brightness"><span class="val" data-val="brightness">' + Math.min(s.value, max) + (s.mode === 'pct' ? '%' : '') + '</span>');
  }
  if (k === 'color'){
    return wrap('Color', '', '<div class="seg-ctl" data-color-mode><button data-v="rgb" aria-pressed="' + (s.mode === 'rgb') + '">Color</button><button data-v="kelvin" aria-pressed="' + (s.mode === 'kelvin') + '">White temperature</button></div>' +
      (s.mode === 'rgb'
        ? '<input type="color" value="' + s.value.toLowerCase() + '" data-feat="color"><span class="val" data-val="color" style="text-align:left">' + s.value.toUpperCase() + '</span>'
        : '<input type="range" class="kelvin-range" min="2000" max="6500" step="100" value="' + s.kelvin + '" data-feat="kelvin"><span class="val" data-val="kelvin">' + s.kelvin + 'K</span>'));
  }
  if (k === 'position') return wrap('Position', 'covers and valves', '<input type="range" min="0" max="100" value="' + s.value + '" data-feat="position"><span class="val" data-val="position">' + s.value + '%</span>');
  if (k === 'fan') return wrap('Fan speed', '', '<input type="range" min="1" max="100" value="' + s.value + '" data-feat="fan"><span class="val" data-val="fan">' + s.value + '%</span>');
  if (k === 'humidity') return wrap('Humidity', '', '<input type="range" min="10" max="90" value="' + s.value + '" data-feat="humidity"><span class="val" data-val="humidity">' + s.value + '%</span>');
  if (k === 'temperature') return wrap('Temperature', '', '<div class="stepper"><button data-temp="-0.5" aria-label="Lower">−</button><output data-val="temperature">' + Number(s.value).toFixed(1) + '°</output><button data-temp="0.5" aria-label="Raise">+</button></div>' +
      (f.f.hvac.on ? '' : '<label class="checkline"><input type="checkbox" data-temp-only' + (s.only ? ' checked' : '') + '>Only set the temperature, don’t turn on</label>'));
  if (k === 'hvac'){
    const modes = hvacModesFor(ed.draft.entities);
    if (!s.on && !modes.includes(s.value)) s.value = modes[0];
    if (!modes.includes(s.value)) modes.push(s.value);     // a saved mode the entity no longer lists is kept
    return wrap('Mode', 'turns the climate on in this mode', '<select class="input" data-feat="hvac">' +
      modes.map(m => '<option value="' + esc(m) + '"' + (m === s.value ? ' selected' : '') + '>' + esc(HVAC_LABELS[m] || m) + '</option>').join('') + '</select>');
  }
  if (k === 'params') return wrap('Script parameters', 'JSON', '<textarea class="input" rows="4" data-feat="params" spellcheck="false" style="flex:1;min-width:200px">' + esc(s.value) + '</textarea>');
  return '';
}

function serializeDraft(){
  const d = ed.draft;
  if (d.type === 'recurring'){
    const r = d.rule;
    return ['every ' + r.every + ' from ' + r.from + ' to ' + r.to + ' ' + (r.action === 'pulse' ? 'pulse ' + r.duration : r.action) + ' days ' + r.weekdays,
            ...settingsToText(r.action === 'off' ? 'off' : 'on', r.extra, r.if_condition, r.force)].join(' ');
  }
  return [...d.entries].sort((a,b) => a.weekdays.localeCompare(b.weekdays) || minuteOf(a.time) - minuteOf(b.time)).map(entryToLine).join('\n');
}

function formFromEntry(e){
  const f = emptyForm();
  f.action = e.action; f.days = e.weekdays; f.ifCondition = e.if_condition !== false; f.force = e.force === true;
  if (e.time.kind === 'clock'){ f.mode = 'clock'; f.time = e.time.value; } else { f.mode = e.time.kind; f.offset = e.time.offset || 0; }
  const x = e.extra || {};
  if (x.brightness !== undefined) f.f.brightness = { on:true, mode:'pct', value:x.brightness };
  if (x.brightness_abs !== undefined) f.f.brightness = { on:true, mode:'abs', value:x.brightness_abs };
  if (x.color) f.f.color = { on:true, mode:'rgb', value:x.color, kelvin:4000 };
  if (x.kelvin !== undefined) f.f.color = { on:true, mode:'kelvin', value:'#FFB35C', kelvin:x.kelvin };
  if (x.position !== undefined) f.f.position = { on:true, value:x.position };
  if (x.fan !== undefined) f.f.fan = { on:true, value:x.fan };
  if (x.temperature !== undefined) f.f.temperature = { on:true, value:x.temperature, only:!!x.temperature_only };
  if (x.hvac_mode) f.f.hvac = { on:true, value:x.hvac_mode };
  if (x.humidity !== undefined) f.f.humidity = { on:true, value:x.humidity };
  if (x.params) f.f.params = { on:true, value:JSON.stringify(x.params, null, 2) };
  return f;
}

/* Recurring schedulers use the same form for their extra settings and condition choice */
function formFromRule(rule){
  return formFromEntry({ action:'on', time:{ kind:'clock', value:'07:00' }, weekdays:rule.weekdays, extra:rule.extra || {}, if_condition:rule.if_condition, force:rule.force });
}
function syncRuleFromForm(){
  const r = ed.draft.rule;
  r.if_condition = ed.draft.condition.trim() ? ed.form.ifCondition : true;
  r.force = !!ed.form.force && canForce(domainsOf(ed.draft.entities));
  r.extra = r.action === 'off' ? {} : extraFromForm(ed.form);
}

function entryFromForm(){
  const f = ed.form, d = ed.draft;
  const time = f.mode === 'clock' ? parseTimeToken(f.time) : { kind:f.mode, offset:f.offset };
  if (!time) throw 'Enter a valid time.';
  const weekdays = d.type === 'weekly' ? String(ed.day) : f.days;
  if (!weekdays) throw 'Choose at least one day.';
  const extra = f.action === 'on' ? extraFromForm(f) : {};
  return { id:ed.editingId || uid(), action:f.action, time, weekdays, extra, if_condition:d.condition.trim() ? f.ifCondition : true,
           force:!!f.force && canForce(domainsOf(d.entities)) };
}

function extraFromForm(f){
  const extra = {};
  const feats = new Set(domainsOf(ed.draft.entities).flatMap(dm => FEATURES_BY_DOMAIN[dm] || []));
  const s = f.f;
  if (feats.has('brightness') && s.brightness.on){
    if (s.brightness.mode === 'abs') extra.brightness_abs = Math.min(255, s.brightness.value);
    else extra.brightness = Math.min(100, s.brightness.value);
  }
  if (feats.has('color') && s.color.on){
    if (s.color.mode === 'kelvin') extra.kelvin = s.color.kelvin; else extra.color = s.color.value.toUpperCase();
  }
  if (feats.has('position') && s.position.on) extra.position = s.position.value;
  if (feats.has('fan') && s.fan.on) extra.fan = s.fan.value;
  const hvacOn = feats.has('hvac') && s.hvac.on;
  if (hvacOn) extra.hvac_mode = s.hvac.value;
  if (feats.has('temperature') && s.temperature.on){ extra.temperature = s.temperature.value; if (s.temperature.only && !hvacOn) extra.temperature_only = true; }
  if (feats.has('humidity') && s.humidity.on) extra.humidity = s.humidity.value;
  if (feats.has('params') && s.params.on){
    let parsed;
    try { parsed = JSON.parse(s.params.value); } catch (err) { throw 'Script parameters are not valid JSON.'; }
    if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) throw 'Script parameters must be a JSON object.';
    extra.params = parsed;
  }
  return extra;
}

/* ---------- editor events ---------- */
editorEl.addEventListener('input', ev => {
  if (!ed) return;
  const t = ev.target;
  if (t.id === 'f-name') ed.draft.name = t.value;
  if (t.id === 'f-cond') ed.draft.condition = t.value;
  if (t.id === 'f-ent'){ ed.entQuery = t.value; ed.entOpen = true; renderPicker(); }
  if (t.id === 'manual') ed.manualText = t.value;
  if (t.id === 'f-time') ed.form.time = t.value;
  if (t.id === 'f-off'){
    // magnetic zero: values within ±10 minutes snap to 0
    let v = +t.value;
    if (v !== 0 && Math.abs(v) <= 10){ v = 0; t.value = 0; }
    if (v === 0 && ed.form.offset !== 0 && navigator.vibrate) navigator.vibrate(8);
    ed.form.offset = v;
    t.parentElement.classList.toggle('at-zero', v === 0);
    document.getElementById('f-off-v').textContent = offsetText(v, ed.form.mode);
  }
  if (t.id === 'r-dur'){ ed.draft.rule.duration = +t.value; document.getElementById('r-dur-v').textContent = t.value + ' min'; }
  if (t.dataset.feat){
    const k = t.dataset.feat, s = ed.form.f;
    const out = edBody.querySelector('[data-val="' + k + '"]');
    if (k === 'kelvin'){ s.color.kelvin = +t.value; if (out) out.textContent = t.value + 'K'; }
    else if (k === 'color'){ s.color.value = t.value.toUpperCase(); if (out) out.textContent = t.value.toUpperCase(); }
    else if (k === 'params'){ s.params.value = t.value; }
    else if (k === 'hvac'){ s.hvac.value = t.value; }
    else { s[k].value = +t.value; if (out) out.textContent = t.value + (k === 'brightness' && s.brightness.mode === 'abs' ? '' : '%'); }
  }
});

editorEl.addEventListener('change', ev => {
  if (!ed) return;
  const t = ev.target;
  if (t.id === 'f-retry') ed.draft.retry = t.checked;
  if (t.id === 'f-cond') renderEditorView();
  if (t.id === 'r-from' || t.id === 'r-to'){ if (t.value) ed.draft.rule[t.id === 'r-from' ? 'from' : 'to'] = t.value; renderEditorView(); }
  if (t.id === 'r-every'){
    ed.draft.rule.every = Math.max(2, Math.min(720, +t.value || 60));
    if (ed.draft.rule.duration >= ed.draft.rule.every) ed.draft.rule.duration = ed.draft.rule.every - 1;
    renderEditorView();
  }
  if (t.id === 'r-dur') renderEditorView();
  if (t.id === 'tl-day'){ ed.day = +t.value; renderEditorView(); }
  if (t.dataset.featOn){ ed.form.f[t.dataset.featOn].on = t.checked; t.closest('.feat').classList.toggle('off', !t.checked); }
  // the mode hides "only set the temperature": draw the extra settings again
  if (t.dataset.featOn === 'hvac' && ed.draft.type !== 'recurring') renderEditorView();
  if (t.hasAttribute('data-temp-only')) ed.form.f.temperature.only = t.checked;
  if (t.id === 'f-force') ed.form.force = t.checked;
  // recurring: the extra settings change every generated event, so the preview is drawn again
  if (ed.draft.type === 'recurring' && t.closest('#rec-extras')) renderEditorView();
});

editorEl.addEventListener('focusin', ev => {
  if (ed && ev.target.id === 'f-ent' && !ed.entOpen){ ed.entOpen = true; renderPicker(); }
});
document.addEventListener('pointerdown', ev => {
  if (ed && ed.entOpen && !ev.target.closest('#picker')){ ed.entOpen = false; renderPicker(); }
});
editorEl.addEventListener('keydown', ev => {
  if (ev.target.id === 'f-ent' && ev.key === 'Enter'){
    const first = edBody.querySelector('[data-add-ent]');
    if (first) first.click();
  }
  if (ev.key === 'Enter' && ev.target.matches('.badge[data-sel]')) ev.target.click();
});

editorEl.addEventListener('click', async ev => {
  if (!ed) return;
  const t = ev.target;
  const btn = t.closest('button');
  const d = ed.draft;

  // entity picker
  const add = t.closest('[data-add-ent]');
  if (add){ d.entities.push(add.dataset.addEnt); ed.entQuery = ''; ed.entOpen = true; renderPicker(); document.getElementById('f-ent').focus(); renderEditorView(); return; }
  const rm = t.closest('[data-rm-ent]');
  if (rm){ d.entities = d.entities.filter(id => id !== rm.dataset.rmEnt); renderPicker(); renderEditorView(); return; }

  // condition test
  if (btn && btn.id === 'cond-test'){
    const out = document.getElementById('cond-result');
    if (!d.condition.trim()){ out.textContent = 'The condition is empty: events always run.'; return; }
    out.textContent = 'Testing…';
    try {
      const r = await api('POST', 'api/template', { template:d.condition });
      if (r.error) ed.condResult = '<span class="err">Error: ' + esc(r.error) + '</span>';
      else {
        const v = String(r.result).trim().toLowerCase();
        ed.condResult = v === 'true' ? '<b class="ok">True</b>: events marked “true” would run now.'
                      : v === 'false' ? '<b>False</b>: events marked “false” would run now.'
                      : '<span class="err">It renders “' + esc(r.result) + '”, which is treated as false. Make it return True or False.</span>';
      }
    } catch (err) { ed.condResult = '<span class="err">' + esc(err.message) + '</span>'; }
    if (ed) document.getElementById('cond-result').innerHTML = ed.condResult;
    return;
  }

  // weekly copy
  if (btn && btn.dataset.copy){
    const src = d.entries.filter(e => e.weekdays === String(ed.day));
    const targets = [...btn.dataset.copy].filter(x => x !== String(ed.day));
    d.entries = d.entries.filter(e => !targets.includes(e.weekdays));
    for (const day of targets) for (const e of src) d.entries.push({ ...JSON.parse(JSON.stringify(e)), id:uid(), weekdays:day });
    renderEditorView(); toast(WD[ed.day-1] + ' copied to ' + daysSummary(targets.join('')));
    return;
  }

  // recurring rule
  if (btn && btn.parentElement.id === 'r-mode'){ d.rule.action = btn.dataset.v; renderEditorView(); return; }

  // day pickers (input card and recurring rule)
  if (btn && btn.dataset.d){
    const forId = btn.parentElement.id;
    const cur = forId === 'r-days' ? d.rule.weekdays : ed.form.days;
    const dd = btn.dataset.d;
    const next = (cur.includes(dd) ? cur.replace(dd, '') : cur + dd).split('').sort().join('');
    if (forId === 'r-days'){ d.rule.weekdays = next; renderEditorView(); }
    else { ed.form.days = next; btn.setAttribute('aria-pressed', next.includes(dd)); }
    return;
  }
  if (btn && btn.dataset.preset){
    if (btn.dataset.for === 'r-days'){ d.rule.weekdays = btn.dataset.preset; renderEditorView(); }
    else { ed.form.days = btn.dataset.preset; edBody.querySelectorAll('#f-days button').forEach(b => b.setAttribute('aria-pressed', btn.dataset.preset.includes(b.dataset.d))); }
    return;
  }

  // zoom
  if (btn && btn.id === 'zoom-in'){ ed.zoom = { 1:2, 2:4, 4:6, 6:6 }[ed.zoom]; renderEditorView(); return; }
  if (btn && btn.id === 'zoom-out'){ ed.zoom = { 6:4, 4:2, 2:1, 1:1 }[ed.zoom]; renderEditorView(); return; }

  // delete a badge
  const del = t.closest('[data-del]');
  if (del){
    d.entries = d.entries.filter(e => e.id !== del.dataset.del);
    if (ed.editingId === del.dataset.del){ ed.editingId = null; ed.form = emptyForm(); }
    ed.manualText = null; renderEditorView(); return;
  }
  // select a badge or a timeline label for editing
  const sel = t.closest('[data-sel]');
  if (sel){
    const e = d.entries.find(x => x.id === sel.dataset.sel);
    if (!e) return;
    if (d.type === 'weekly') ed.day = +e.weekdays;
    ed.editingId = e.id; ed.form = formFromEntry(e);
    renderEditorView();
    document.getElementById('inputcard').scrollIntoView({ behavior:'smooth', block:'nearest' });
    return;
  }
  // tap on the timeline bar: prefill a new event at that time
  const track = t.closest('#tl-track');
  if (track && d.type !== 'recurring'){
    const r = track.getBoundingClientRect();
    const min = Math.round(((ev.clientX - r.left) / r.width) * 1440 / 5) * 5;
    const keepDays = ed.form.days;
    ed.editingId = null;
    ed.form = emptyForm();
    ed.form.days = keepDays;
    ed.form.mode = 'clock'; ed.form.time = toHHMM(Math.min(1435, min));
    const band = bandsForDay(d.entries, ed.day).find(s => min >= s.from && min < s.to);
    ed.form.action = band && band.state === 'on' ? 'off' : 'on';    // suggest the opposite of the current state
    renderEditorView();
    const card = document.getElementById('inputcard');
    card.scrollIntoView({ behavior:'smooth', block:'nearest' });
    card.classList.add('flash');
    return;
  }
  // weekly: tap a day row or label to select that day
  const wk = t.closest('[data-wkday]');
  if (wk && +wk.dataset.wkday !== ed.day){ ed.day = +wk.dataset.wkday; ed.editingId = null; ed.form = emptyForm(); renderEditorView(); return; }

  // input card controls
  if (btn && btn.parentElement.id === 'f-action'){ ed.form.action = btn.dataset.v; renderEditorView(); return; }
  if (btn && btn.parentElement.id === 'f-mode'){ ed.form.mode = btn.dataset.v; renderEditorView(); return; }
  if (btn && btn.parentElement.id === 'f-when'){ ed.form.ifCondition = btn.dataset.v === 'true'; renderEditorView(); return; }
  if (btn && btn.parentElement.hasAttribute('data-bri-mode')){
    const s = ed.form.f.brightness;
    if (s.mode !== btn.dataset.v){ s.value = btn.dataset.v === 'abs' ? Math.round(s.value * 2.55) : Math.max(1, Math.round(s.value / 2.55)); s.mode = btn.dataset.v; }
    renderEditorView(); return;
  }
  if (btn && btn.parentElement.hasAttribute('data-color-mode')){ ed.form.f.color.mode = btn.dataset.v; renderEditorView(); return; }
  if (btn && btn.dataset.temp){
    const s = ed.form.f.temperature;
    s.value = Math.max(5, Math.min(40, s.value + Number(btn.dataset.temp)));
    edBody.querySelector('[data-val="temperature"]').textContent = s.value.toFixed(1) + '°';
    if (d.type === 'recurring') renderEditorView();
    return;
  }
  if (btn && btn.id === 'ev-cancel'){ ed.editingId = null; ed.form = emptyForm(); renderEditorView(); return; }
  if (btn && btn.id === 'ev-add'){
    try {
      if (!d.entities.length) throw 'Add at least one entity first.';
      const e = entryFromForm();
      if (ed.editingId) d.entries = d.entries.map(x => x.id === ed.editingId ? e : x);
      else d.entries.push(e);
      const keepDays = ed.form.days;
      ed.editingId = null; ed.form = emptyForm(); ed.form.days = keepDays; ed.manualText = null;
      renderEditorView();
    } catch (err) { document.getElementById('ev-err').textContent = err; }
    return;
  }

  // text tabs and manual editing
  if (btn && btn.dataset.tab){ ed.textTab = btn.dataset.tab; ed.manualText = null; ed.manualErr = ''; renderEditorView(); return; }
  if (btn && btn.id === 'manual-reset'){ ed.manualText = null; ed.manualErr = ''; renderEditorView(); return; }
  if (btn && btn.id === 'manual-apply'){
    const text = ed.manualText !== null ? ed.manualText : serializeDraft();
    try {
      if (d.type === 'recurring'){
        const { rest, params } = splitParams(text.trim());
        const m = rest.match(/^every\s+(\d+)\s+from\s+(\d{1,2}:\d{2})\s+to\s+(\d{1,2}:\d{2})\s+(on|off|pulse\s+\d+)\s+days\s+([1-7]{1,7})((?:\s+\S+)*)$/i);
        if (!m) throw 'Use the format: every 60 from 06:00 to 20:00 pulse 10 days 135';
        const from = parseTimeToken(m[2]), to = parseTimeToken(m[3]);
        if (!from || !to) throw '“From” and “To” must be valid hh:mm times.';
        const action = m[4].toLowerCase().startsWith('pulse') ? 'pulse' : m[4].toLowerCase();
        const { extra, ifCondition, force } = parseSettings(m[6].trim() ? m[6].trim().split(/\s+/) : [], params);
        if (action === 'off' && Object.keys(extra).length) throw 'Extra settings work only when the action turns on.';
        d.rule = { from:from.value, to:to.value, every:Math.max(2, +m[1]), action, duration:action === 'pulse' ? +m[4].split(/\s+/)[1] : d.rule.duration,
                   weekdays:[...new Set(m[5])].sort().join(''), extra, if_condition:ifCondition, force };
      } else {
        const lines = text.split('\n').map(l => l.trim()).filter(l => l && !l.startsWith('#'));
        const parsed = lines.map((l, i) => { try { return lineToEntry(l); } catch (msg) { throw 'Line ' + (i+1) + ': ' + msg; } });
        d.entries = d.type === 'weekly' ? parsed.flatMap(e => [...e.weekdays].map(day => ({ ...e, id:uid(), weekdays:day }))) : parsed;
      }
      ed.manualText = null; ed.manualErr = ''; ed.editingId = null; ed.textTab = 'preview';
      ed.form = d.type === 'recurring' ? formFromRule(d.rule) : emptyForm();
      renderEditorView(); toast('Text applied');
    } catch (err) { ed.manualErr = String(err); renderEditorView(); }
    return;
  }

  // delete scheduler
  if (btn && btn.id === 'ed-delete'){
    if (!ed.delArmed){
      ed.delArmed = true; btn.classList.add('armed'); btn.innerHTML = ICON.trash + ' Click again to delete';
      setTimeout(() => { if (ed && btn.isConnected){ ed.delArmed = false; btn.classList.remove('armed'); btn.innerHTML = ICON.trash + ' Delete scheduler'; } }, 3000);
      return;
    }
    const name = d.name, id = d.id;
    closeEditor();
    mutate(api('DELETE', 'api/schedulers/' + id), 'Deleted “' + name + '”');
  }
});

document.getElementById('ed-back').addEventListener('click', closeEditor);
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && ed && !ed.entOpen && chooserEl.hidden) closeEditor(); });

document.getElementById('ed-save').addEventListener('click', async () => {
  const d = ed.draft, err = document.getElementById('ed-err');
  err.textContent = '';
  if (!d.name.trim()){ err.textContent = 'Add a name'; edBody.querySelector('#f-name').focus(); return; }
  if (!d.entities.length){ err.textContent = 'Add at least one entity'; return; }
  if (d.type === 'recurring'){
    try { syncRuleFromForm(); } catch (msg) { err.textContent = String(msg); return; }
    d.entries = generateRecurring(d.rule);
  }
  if (!d.entries.length){ err.textContent = 'Add at least one event'; return; }
  const button = document.getElementById('ed-save');
  button.disabled = true;
  try {
    const data = await api('POST', 'api/schedulers', toServer(d));
    const name = d.name.trim();
    closeEditor();
    applyState(data.state);
    toast('Saved “' + name + '”');
  } catch (e) {
    err.textContent = e.message;
  } finally {
    button.disabled = false;
  }
});

/* ============================================================
   Options and logs
   ============================================================ */
let logLines = [], logFilter = 'all', logQuery = '', optDraft = null, logTimer = null;

function openSheet(id){ document.getElementById(id).hidden = false; document.body.style.overflow = 'hidden'; }
function closeSheets(){
  document.querySelectorAll('.sheet').forEach(s => { s.hidden = true; });
  if (!ed) document.body.style.overflow = '';
  clearInterval(logTimer); logTimer = null;
}

async function fetchLog(){
  try {
    const data = await api('GET', 'api/log');
    // "[2026-11-06 07:15:05] WARNING message"; lines without a timestamp continue the previous one
    const parsed = [];
    for (const raw of data.lines){
      const m = raw.match(/^\[(\d{4}-\d\d-\d\d) (\d\d:\d\d:\d\d)\] (DEBUG|INFO|WARNING|ERROR|CRITICAL)\s+(.*)$/);
      if (m) parsed.push({ date:m[1], time:m[2], level:m[3] === 'CRITICAL' ? 'error' : m[3].toLowerCase(), msg:m[4] });
      else if (parsed.length) parsed[parsed.length-1].msg += '\n' + raw;
      else parsed.push({ date:'', time:'', level:'info', msg:raw });
    }
    logLines = parsed;
    renderLogs();
  } catch (err) { document.getElementById('log-meta').textContent = err.message; }
}

function renderLogs(){
  const view = document.getElementById('log-view');
  const atBottom = view.scrollHeight - view.scrollTop - view.clientHeight < 40;
  const q = logQuery.toLowerCase();
  const today = logLines.length ? logLines[logLines.length-1].date : '';
  const lines = logLines.filter(l =>
    (logFilter === 'all' || (logFilter === 'warning' ? l.level === 'warning' || l.level === 'error' : l.level === 'error')) &&
    (!q || l.msg.toLowerCase().includes(q)));
  const mark = s => q ? esc(s).replace(new RegExp(esc(q).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), m => '<mark>' + m + '</mark>') : esc(s);
  view.innerHTML = lines.length
    ? lines.map(l => '<div class="log-line ' + l.level + '"><span class="lt" title="' + l.date + '">' + (l.date && l.date !== today ? l.date.slice(5) + ' ' : '') + l.time + '</span><span class="lv">' + l.level.toUpperCase() + '</span><span class="lm">' + mark(l.msg) + '</span></div>').join('')
    : '<div class="log-empty">' + (logLines.length ? 'No lines match the filter.' : 'The log is empty.') + '</div>';
  if (atBottom || !renderLogs.done) view.scrollTop = view.scrollHeight;
  renderLogs.done = true;
  document.getElementById('log-meta').textContent = lines.length + ' of ' + logLines.length + ' lines' + (app.options.debug ? ', debug mode on' : '');
}

function renderOptions(){
  const o = optDraft;
  const sw = (id, on, label) => '<label class="switch"><input type="checkbox" id="' + id + '"' + (on ? ' checked' : '') + ' aria-label="' + label + '"><span class="knob"></span></label>';
  const notifiers = app.notifiers || [];
  if (o.notifier && !notifiers.includes(o.notifier)) notifiers.push(o.notifier);
  document.getElementById('opt-body').innerHTML =
    '<div class="opt-row"><span class="ot">Retries when an entity doesn’t respond</span><span class="oh">The first check is after 5 seconds, then one every minute.</span>' +
      '<span class="oc stepper"><button data-retry="-1" aria-label="Fewer retries">−</button><output id="opt-retries">' + o.max_retry + '</output><button data-retry="1" aria-label="More retries">+</button></span></div>' +
    '<div class="opt-row"><span class="ot">Notify on error</span><span class="oh">Notifier used when an action fails. Notifiers are set up in Home Assistant.' + (app.notifiers === null ? ' Loading the list…' : '') + '</span>' +
      '<select class="input oc" id="opt-notifier"><option value="">Disabled</option>' + notifiers.map(n => '<option value="' + esc(n) + '"' + (o.notifier === n ? ' selected' : '') + '>notify.' + esc(n) + '</option>').join('') + '</select></div>' +
    '<div class="opt-row"><span class="ot">Always show details</span><span class="oh">Show every scheduler’s details in the list. The eye icon still hides them one by one.</span><span class="oc">' + sw('opt-details', o.details_uncovered, 'Always show details') + '</span></div>' +
    '<div class="opt-row"><span class="ot">Switches in Home Assistant</span><span class="oh">Creates a switch for every scheduler through MQTT. The broker is found automatically; set it in the app configuration to use another one.' + (o.mqtt_enabled ? ' Status: ' + esc(app.status.mqtt || '') + '.' : '') + '</span><span class="oc">' + sw('opt-mqtt', o.mqtt_enabled, 'Switches in Home Assistant') + '</span></div>' +
    '<div class="opt-row"><span class="ot">Theme</span><span class="oh">Automatic follows the light or dark theme of your device.</span>' +
      '<select class="input oc" id="opt-theme">' + [['auto','Automatic'],['light','Light'],['dark','Dark']].map(([v, l]) => '<option value="' + v + '"' + ((o.theme || 'auto') === v ? ' selected' : '') + '>' + l + '</option>').join('') + '</select></div>' +
    '<div class="opt-row"><span class="ot">Debug mode</span><span class="oh">Writes detailed lines to the log. The log grows quickly, so turn it off when you’re done.</span><span class="oc">' + sw('opt-debug', o.debug, 'Debug mode') + '</span></div>' +
    '<div class="opt-row wide"><span class="ot">Hidden entities</span><span class="oh">Entities you never want in the list, one pattern per line. Use * as a wildcard, for example <code>switch.*_led</code>.</span>' +
      '<textarea class="input oc" id="opt-excluded" rows="4" spellcheck="false">' + esc(o.excluded_entities) + '</textarea></div>';
}

document.getElementById('btn-logs').addEventListener('click', () => {
  renderLogs.done = false; logLines = []; renderLogs();
  openSheet('sheet-logs'); fetchLog();
  logTimer = setInterval(fetchLog, 5000);
});
document.getElementById('btn-options').addEventListener('click', async () => {
  optDraft = { ...app.options }; renderOptions(); openSheet('sheet-options');
  try { app.notifiers = await api('GET', 'api/notifiers'); } catch (err) { app.notifiers = []; }
  if (optDraft) renderOptions();
});
document.querySelectorAll('.sheet').forEach(sheet => sheet.addEventListener('click', ev => {
  if (ev.target === sheet || ev.target.closest('[data-close]')) closeSheets();
}));
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && [...document.querySelectorAll('.sheet')].some(s => !s.hidden)) closeSheets();
});
document.getElementById('log-filter').addEventListener('click', ev => {
  const b = ev.target.closest('button');
  if (!b) return;
  logFilter = b.dataset.v;
  b.parentElement.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
  renderLogs();
});
document.getElementById('log-q').addEventListener('input', ev => { logQuery = ev.target.value.trim(); renderLogs(); });
document.getElementById('log-clear').addEventListener('click', async () => {
  try { await api('POST', 'api/log/clear'); toast('Log cleared'); fetchLog(); } catch (err) { toast(err.message); }
});
document.getElementById('opt-body').addEventListener('click', ev => {
  const b = ev.target.closest('[data-retry]');
  if (!b) return;
  optDraft.max_retry = Math.max(0, Math.min(5, optDraft.max_retry + Number(b.dataset.retry)));
  document.getElementById('opt-retries').textContent = optDraft.max_retry;
});
document.getElementById('opt-body').addEventListener('change', ev => {
  const t = ev.target;
  if (t.id === 'opt-notifier') optDraft.notifier = t.value;
  if (t.id === 'opt-details') optDraft.details_uncovered = t.checked;
  if (t.id === 'opt-mqtt') optDraft.mqtt_enabled = t.checked;
  if (t.id === 'opt-debug') optDraft.debug = t.checked;
  if (t.id === 'opt-theme') optDraft.theme = t.value;
});
document.getElementById('opt-body').addEventListener('input', ev => {
  if (ev.target.id === 'opt-excluded') optDraft.excluded_entities = ev.target.value;
});
document.getElementById('opt-save').addEventListener('click', async () => {
  if (optDraft.details_uncovered !== app.options.details_uncovered) app.openDetails = {};
  const excludedChanged = optDraft.excluded_entities !== app.options.excluded_entities;
  const data = await mutate(api('POST', 'api/options', optDraft), 'Options saved');
  if (data){ closeSheets(); optDraft = null; if (excludedChanged) loadEntities(true); }
});

/* ============================================================
   Start
   ============================================================ */
applyState(JSON.parse(document.getElementById('initial-state').textContent));
loadEntities().then(() => { if (!ed) renderList(); });

</script>
</body>

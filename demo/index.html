<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SimpleScheduler demo</title>
<style>
/* SimpleScheduler 4 – styles */
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --surface-2:#F5F7FA; --line:#DAE0E8; --line-strong:#C3CBD6;
  --text:#18202C; --muted:#5E6A7B; --accent:#2D5BD7; --accent-soft:#E3EAFB; --on-accent:#FFFFFF;
  --on:#3A6FE0; --on-soft:#DCE6FB; --on-ink:#1C3E8C;
  --ev-on:#1F9D55; --ev-on-soft:#DDF3E5; --ev-on-ink:#0E5A2F; --ev-off:#D23C3C; --ev-off-soft:#FBE1E1; --ev-off-ink:#8A1F1F;
  --off:#64748B; --off-soft:#E2E7EE; --off-ink:#334155;
  --sunrise:#D99A12; --sunset:#C4513A; --danger:#C53A3A; --danger-soft:#FBE4E4;
  --shadow:0 1px 2px rgba(24,32,44,.06), 0 6px 18px rgba(24,32,44,.06);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13171E; --surface:#1B212B; --surface-2:#212835; --line:#2D3644; --line-strong:#3E4959;
    --text:#E7EBF1; --muted:#97A3B4; --accent:#86A2FF; --accent-soft:#25304B; --on-accent:#0F1626;
    --on:#6F95FF; --on-soft:#22305A; --on-ink:#C9D7FF;
    --ev-on:#3CC77A; --ev-on-soft:#173A27; --ev-on-ink:#BDF0D2; --ev-off:#F06A6A; --ev-off-soft:#43201F; --ev-off-ink:#FFC9C9;
    --off:#7F8DA3; --off-soft:#2A3240; --off-ink:#CBD5E1;
    --sunrise:#F0C04A; --sunset:#EB7A5F; --danger:#F07171; --danger-soft:#3D2226;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#13171E; --surface:#1B212B; --surface-2:#212835; --line:#2D3644; --line-strong:#3E4959;
  --text:#E7EBF1; --muted:#97A3B4; --accent:#86A2FF; --accent-soft:#25304B; --on-accent:#0F1626;
  --on:#6F95FF; --on-soft:#22305A; --on-ink:#C9D7FF;
  --ev-on:#3CC77A; --ev-on-soft:#173A27; --ev-on-ink:#BDF0D2; --ev-off:#F06A6A; --ev-off-soft:#43201F; --ev-off-ink:#FFC9C9;
  --off:#7F8DA3; --off-soft:#2A3240; --off-ink:#CBD5E1;
  --sunrise:#F0C04A; --sunset:#EB7A5F; --danger:#F07171; --danger-soft:#3D2226;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Figtree,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{flex:none}
.wrap{max-width:960px;margin:0 auto;padding:0 16px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* header */
.app-header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.app-header .wrap{display:flex;align-items:center;gap:12px;min-height:60px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--text);color:var(--bg);display:grid;place-items:center}
.brand h1{font-size:18px;font-weight:700;margin:0;letter-spacing:-.01em;white-space:nowrap}
.brand .ver{font-size:12px;color:var(--muted);font-weight:500}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:8px 13px;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.danger.armed{background:var(--danger);color:#fff}
.btn.small{padding:5px 10px;font-size:13px;border-radius:8px}
@media (max-width:560px){.btn .lbl-hide{display:none}.btn.icon-only-sm{padding:8px}}

.infobar{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;padding:12px 0 4px;color:var(--muted);font-size:13px}
.infobar span{display:inline-flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:#2FA36B;display:inline-block}
.legend{margin-left:auto;display:inline-flex;gap:12px}
.legend i{display:inline-block;width:18px;height:8px;border-radius:4px;vertical-align:middle;margin-right:5px}

/* list */
main.wrap{padding-top:6px;padding-bottom:48px}
.list{display:flex;flex-direction:column;gap:10px;min-height:40px}
.sched{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.sched-main{display:grid;grid-template-columns:auto minmax(0,1.1fr) minmax(140px,1fr) auto;grid-template-areas:"handle title mini actions";align-items:center;gap:10px;padding:10px 10px 10px 4px}
.handle{grid-area:handle;border:0;background:none;color:var(--muted);padding:8px 4px;border-radius:8px;cursor:grab;touch-action:none;display:grid;place-items:center}
.handle:hover{color:var(--text);background:var(--surface-2)}
.title{grid-area:title;min-width:0}
.title .name{font-weight:600;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.title .meta{font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tag{font-size:11.5px;font-weight:600;border-radius:6px;padding:1px 7px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.mini{grid-area:mini;position:relative;padding-bottom:14px}
.mini-track{position:relative;height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.mini-track .seg{position:absolute;top:0;bottom:0}
.seg.on{background:var(--on)}
.seg.off{background:var(--off-soft)}
.mini-now{position:absolute;top:-3px;width:2px;height:16px;background:var(--text);border-radius:1px}
.mini-ticks{position:absolute;left:0;right:0;bottom:0;height:12px;font-size:10px;color:var(--muted)}
.mini-ticks span{position:absolute;transform:translateX(-50%)}
.mini-empty{font-size:12px;color:var(--muted)}
.actions{grid-area:actions;display:flex;align-items:center;gap:2px}
.icon-btn{width:36px;height:36px;border:0;background:none;border-radius:9px;color:var(--muted);display:grid;place-items:center}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.icon-btn.active{color:var(--accent)}
.icon-btn.danger:hover{color:var(--danger);background:var(--danger-soft)}
.sched.disabled .title .name{color:var(--muted)}
.sched.disabled .mini{opacity:.45;filter:grayscale(1)}
@media (max-width:640px){
  /* the name gets the whole width, the actions move next to the meta line */
  .sched-main{grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"handle name name" "handle meta actions" ". mini mini";row-gap:2px;padding-right:8px}
  .title{display:contents}
  .title .name{grid-area:name;min-width:0;padding-right:6px}
  .title .meta{grid-area:meta;min-width:0}
  .mini{padding-right:6px;margin-top:4px}
}

.switch{position:relative;display:inline-block;width:42px;height:24px;flex:none;margin-left:4px}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;z-index:1}
.switch .knob{position:absolute;inset:0;border-radius:12px;background:var(--line-strong);transition:background .15s}
.switch .knob::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.switch input:checked + .knob{background:var(--on)}
.switch input:checked + .knob::after{transform:translateX(18px)}
.switch input:focus-visible + .knob{outline:2px solid var(--accent);outline-offset:2px}

.details{border-top:1px solid var(--line);padding:12px 14px 14px 44px;display:grid;gap:10px;font-size:13.5px}
.details h4{margin:0 0 4px;font-size:12px;font-weight:600;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);padding:3px 10px;font-size:13px}
.chip small{color:var(--muted)}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;overflow-x:auto;white-space:pre}
.daylines{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;align-items:baseline}
.daylines .d{color:var(--muted);font-weight:600;font-size:12.5px}
.daylines .ev{display:flex;flex-wrap:wrap;gap:4px 12px}
.ev-txt b{font-weight:600}
.ev-txt.on b{color:var(--ev-on)}
.ev-txt.off b{color:var(--ev-off)}
.ev-txt.on{color:var(--text)}

/* groups */
.group{background:var(--surface-2);border:1px solid var(--line);border-radius:16px}
.group-head{display:flex;align-items:center;gap:6px;padding:8px 10px 8px 4px}
.chev{transition:transform .15s}
.group.collapsed .chev{transform:rotate(-90deg)}
.group-name{border:1px solid transparent;background:transparent;border-radius:8px;padding:5px 8px;font-weight:700;font-size:15px;min-width:0;flex:1 1 auto;max-width:360px}
.group-name:hover{border-color:var(--line)}
.group-name:focus{border-color:var(--accent);background:var(--surface);outline:none}
.group-count{font-size:12.5px;color:var(--muted);white-space:nowrap;margin-right:auto}
.group-body{display:flex;flex-direction:column;gap:8px;padding:0 10px 12px 26px;min-height:48px;position:relative}
.group-body::before{content:"";position:absolute;left:14px;top:0;bottom:14px;width:2px;border-radius:1px;background:var(--line)}
.group.collapsed .group-body{display:none}
.group.disabled .group-name{color:var(--muted)}
.empty-hint{border:1.5px dashed var(--line-strong);border-radius:12px;color:var(--muted);font-size:13px;text-align:center;padding:12px}
.group.drop-target{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
@media (max-width:560px){.group-count{display:none}.group-body{padding-left:18px;padding-right:6px}.group-body::before{left:9px}}

/* drag */
.ghost{position:fixed;z-index:200;pointer-events:none;opacity:.94;box-shadow:0 14px 34px rgba(0,0,0,.22);transform:rotate(.6deg)}
.placeholder{border:2px dashed var(--accent);border-radius:14px;background:var(--accent-soft);opacity:.7}
body.dragging{user-select:none;-webkit-user-select:none;cursor:grabbing}

.empty-state{text-align:center;padding:48px 16px;color:var(--muted)}

/* editor */
.editor{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;display:none;padding-bottom:env(safe-area-inset-bottom,0px)}
.editor.open{display:block}
.ed-head{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.ed-head .wrap{display:flex;align-items:center;gap:10px;min-height:60px}
.ed-head h2{font-size:17px;margin:0;margin-right:auto;font-weight:700}
.ed-body{max-width:880px;margin:0 auto;padding:18px 16px 60px;display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.card > h3{margin:0 0 12px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card > h3 .sub{font-size:13px;color:var(--muted);font-weight:500}
.card > h3 .right{margin-left:auto;display:flex;gap:6px;align-items:center}
.field{display:grid;gap:6px}
.field label,.flabel{font-size:13px;font-weight:600;color:var(--muted)}
.input{border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:9px 11px;width:100%}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.name-input{font-size:20px;font-weight:700;padding:10px 12px}
textarea.input{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;resize:vertical;min-height:90px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.seg-ctl{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px;flex-wrap:wrap}
.seg-ctl button{border:0;background:none;border-radius:8px;padding:7px 14px;font-weight:600;font-size:14px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.seg-ctl button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg-ctl.action button[data-v="on"][aria-pressed="true"]{background:var(--ev-on);color:#fff}
.seg-ctl.action button[data-v="off"][aria-pressed="true"]{background:var(--ev-off);color:#fff}
.type-help{font-size:13px;color:var(--muted);margin:8px 0 0}

.days{display:flex;gap:5px;flex-wrap:wrap}
.days button{width:44px;height:36px;border-radius:9px;border:1px solid var(--line-strong);background:var(--surface);font-weight:600;font-size:13px;color:var(--muted)}
.days button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.days-quick{display:flex;gap:4px;margin-left:4px}

/* entity picker */
.picker{position:relative}
.picker .chips{margin-bottom:8px}
.chip .x{border:0;background:none;padding:0;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.chip .x:hover{background:var(--danger-soft);color:var(--danger)}
.dropdown{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;box-shadow:var(--shadow);max-height:260px;overflow:auto;z-index:10;padding:4px}
.dropdown button{display:flex;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;gap:10px;align-items:baseline}
.dropdown button:hover,.dropdown button.hl{background:var(--surface-2)}
.dropdown small{color:var(--muted);margin-left:auto;font-size:12px}
.dropdown .none{padding:10px;color:var(--muted);font-size:13px}

/* timeline */
.tl-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tl-scroll{overflow-x:auto;overflow-y:hidden;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);-webkit-overflow-scrolling:touch}
.tl-inner{position:relative;height:168px;min-width:100%}
.tl-hour{position:absolute;top:0;bottom:22px;width:1px;background:var(--line)}
.tl-hour.minor{background:var(--line);opacity:.5}
.tl-hlabel{position:absolute;bottom:4px;font-size:11px;color:var(--muted);transform:translateX(-50%)}
.tl-hlabel.edge-l{transform:none;padding-left:4px}
.tl-hlabel.edge-r{transform:translateX(-100%);padding-right:4px}
.tl-track{position:absolute;left:0;right:0;top:96px;height:26px;cursor:crosshair}
.tl-track .seg{position:absolute;top:0;bottom:0}
.tl-track .seg.on{background:var(--on)}
.tl-track .seg.off{background:var(--off-soft)}
.tl-track .noevents{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;color:var(--muted);border-top:1px dashed var(--line-strong);border-bottom:1px dashed var(--line-strong)}
.tl-pin{position:absolute;top:0;width:0;height:122px}
.tl-pin .stem{position:absolute;left:-1px;width:2px;bottom:0;background:var(--text);opacity:.55}
.tl-pin button{position:absolute;transform:translateX(-50%);white-space:nowrap;border:1.5px solid transparent;border-radius:7px;font-size:11.5px;font-weight:700;padding:1px 6px;line-height:16px}
.tl-pin.on button{background:var(--ev-on-soft);color:var(--ev-on-ink);border-color:var(--ev-on)}
.tl-pin.off button{background:var(--ev-off-soft);color:var(--ev-off-ink);border-color:var(--ev-off)}
.tl-pin.sel button{outline:2px solid var(--accent);outline-offset:1px}
.tl-sun{position:absolute;top:0;bottom:22px;width:0;border-left:1.5px dashed}
.tl-sun.rise{border-color:var(--sunrise)}
.tl-sun.set{border-color:var(--sunset)}
.tl-sun span{position:absolute;bottom:2px;left:4px;font-size:10.5px;font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:3px}
.tl-sun.rise span{color:var(--sunrise)}
.tl-sun.set span{color:var(--sunset)}
.tl-now{position:absolute;top:90px;height:38px;width:2px;background:var(--text);border-radius:1px}
.tl-hint{font-size:12.5px;color:var(--muted);margin-top:8px}

/* week overview */
.week{display:grid;gap:4px}
.week-row{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center;border:1px solid transparent;border-radius:10px;padding:5px 8px 5px 4px;background:none;text-align:left;width:100%}
.week-row:hover{background:var(--surface-2)}
.week-row[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.week-row .d{font-weight:700;font-size:13px}
.week-row .mini{padding-bottom:0}
.copy-tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px;font-size:13px;color:var(--muted)}

/* weekly: all days at once */
.wk-wrap{display:grid;grid-template-columns:46px minmax(0,1fr);gap:6px}
.wk-labels{display:flex;flex-direction:column;padding:1px 0 22px}
.wk-lab{height:54px;border:0;background:none;border-radius:9px;font-weight:700;font-size:13px;color:var(--muted);text-align:left;padding:0 6px}
.wk-lab:hover{background:var(--surface-2);color:var(--text)}
.wk-lab.sel{color:var(--accent);background:var(--accent-soft)}
.wk-inner{position:relative;min-width:100%;padding-bottom:22px}
.wk-inner .tl-hour,.wk-inner .tl-sun{pointer-events:none;z-index:0;opacity:.7}
.wk-row{position:relative;height:54px;cursor:pointer}
.wk-row + .wk-row{box-shadow:inset 0 1px 0 var(--line)}
.wk-row:hover{background:color-mix(in srgb, var(--accent-soft) 45%, transparent)}
.wk-row.sel{background:var(--accent-soft)}
.wk-track{position:absolute;left:0;right:0;bottom:5px;height:16px;background:var(--surface);box-shadow:inset 0 1px 0 var(--line), inset 0 -1px 0 var(--line)}
.wk-row.sel .wk-track{cursor:crosshair}
.wk-track .seg{position:absolute;top:0;bottom:0}
.wk-pin{position:absolute;z-index:1;transform:translateX(-50%);font-size:10.5px;font-weight:700;line-height:13px;padding:0 4px;border-radius:5px;border:1px solid;white-space:nowrap}
.wk-pin.on{background:var(--ev-on-soft);color:var(--ev-on-ink);border-color:var(--ev-on)}
.wk-pin.off{background:var(--ev-off-soft);color:var(--ev-off-ink);border-color:var(--ev-off)}
.wk-pin.sel{outline:2px solid var(--accent);outline-offset:1px}
/* labels near midnight: aligned to the edge, so they don't overflow the timeline */
.tl-pin.edge-l button,.wk-pin.edge-l{transform:none}
.tl-pin.edge-r button,.wk-pin.edge-r{transform:translateX(-100%)}
.wk-now{position:absolute;z-index:1;bottom:1px;height:24px;width:2px;background:var(--text);border-radius:1px;pointer-events:none}

/* badges */
.badges{display:flex;flex-wrap:wrap;gap:8px}
.badge{display:inline-flex;align-items:center;gap:7px;border-radius:10px;border:1.5px solid;padding:4px 4px 4px 8px;font-size:13.5px;background:var(--surface);cursor:pointer;max-width:100%}
.badge.on{border-color:var(--ev-on)}
.badge.off{border-color:var(--ev-off)}
.badge.sel{box-shadow:0 0 0 3px var(--accent-soft);border-color:var(--accent)}
.badge.ro{cursor:default;padding-right:8px}
.badge .act{font-weight:700;font-size:11.5px;border-radius:6px;padding:1px 6px}
.badge.on .act{background:var(--ev-on);color:#fff}
.badge.off .act{background:var(--ev-off);color:#fff}
.badge .tm{font-weight:700;display:inline-flex;align-items:center;gap:4px}
.badge .ex{display:inline-flex;gap:5px;align-items:center;color:var(--muted);font-size:12.5px}
.badge .wd{color:var(--muted);font-size:12px}
.badge .x{border:0;background:none;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;color:var(--muted)}
.badge .x:hover{background:var(--danger-soft);color:var(--danger)}
.swatch{width:13px;height:13px;border-radius:4px;border:1px solid rgba(0,0,0,.2);display:inline-block}
.badges-empty{color:var(--muted);font-size:13.5px}

/* input card */
.inputcard{border:1.5px solid var(--line-strong);border-radius:14px;padding:14px;margin-top:14px;background:var(--surface-2);display:grid;gap:14px}
.inputcard.editing{border-color:var(--accent)}
.inputcard.flash{animation:flash .6s}
@keyframes flash{0%{box-shadow:0 0 0 0 var(--accent)}100%{box-shadow:0 0 0 8px transparent}}
.inputcard .head{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:14px}
.offset-ctl{display:flex;align-items:center;gap:10px;flex:1;min-width:220px}
.offset-ctl input[type=range]{flex:1}
.offset-val{font-weight:700;min-width:84px;text-align:right}
.offset-slider{position:relative;flex:1;padding-bottom:10px}
.offset-slider input{width:100%;display:block;margin:0}
.zero-tick{position:absolute;left:calc(50% - 1px);top:21px;width:2px;height:9px;border-radius:1px;background:var(--line-strong);pointer-events:none;transition:background .12s,height .12s}
.offset-slider.at-zero .zero-tick{background:var(--accent);height:11px}
input[type=range]{accent-color:var(--accent);height:24px}
input[type=time].input{width:130px}
.extras{display:grid;gap:10px}
.extras .note{font-size:12.5px;color:var(--muted)}
.feat{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px}
.feat .fname{font-weight:600;font-size:14px;display:flex;align-items:center;gap:10px}
.feat .fname small{font-weight:500;color:var(--muted)}
.feat .ctl{grid-column:1 / -1;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.feat.off .ctl{opacity:.4;pointer-events:none}
.feat .ctl input[type=range]{flex:1;min-width:140px}
.feat .val{font-weight:700;min-width:54px;text-align:right}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line-strong);border-radius:10px;overflow:hidden}
.stepper button{border:0;background:var(--surface-2);width:38px;height:38px;font-size:18px;font-weight:700}
.stepper output{min-width:70px;text-align:center;font-weight:700;font-size:16px}
input[type=color]{width:48px;height:36px;border:1px solid var(--line-strong);border-radius:9px;padding:2px;background:var(--surface)}
.checkline{display:inline-flex;align-items:center;gap:8px;font-size:13.5px}
.checkline input{accent-color:var(--accent);width:16px;height:16px}
.force-ic{display:inline-block;vertical-align:-2px;flex:none}
.badge .force{display:inline-flex;align-items:center}
.card-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.err{color:var(--danger);font-size:13px;font-weight:600}

/* text */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px}
.tabs button{border:0;background:none;padding:8px 12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent)}
.syntax{font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.6}
.syntax code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:0 4px}

.rule-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:all .2s;z-index:300}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:400px){.brand .ver{display:none}.app-header .wrap{gap:6px}}

/* side sheets: logs and options */
.sheet{position:fixed;inset:0;z-index:55;background:rgba(10,14,20,.45);display:flex;justify-content:flex-end}
.sheet[hidden]{display:none}
.sheet-box{background:var(--surface);width:min(620px,100%);height:100%;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.2);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 12px 20px;border-bottom:1px solid var(--line)}
.sheet-head h2{margin:0;font-size:17px}
.sheet-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 20px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.log-tools{display:flex;gap:10px;flex-wrap:wrap;padding:12px 20px;align-items:center}
.log-tools .input{flex:1;min-width:160px;padding:7px 10px}
.log-view{flex:1;overflow:auto;padding:4px 0 12px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.55;background:var(--surface-2);border-top:1px solid var(--line)}
.log-line{display:grid;grid-template-columns:auto auto 1fr;gap:10px;padding:2px 20px;align-items:baseline}
.log-line:hover{background:var(--surface)}
.log-line .lt{color:var(--muted)}
.log-line .lv{font-weight:700;font-size:11px;min-width:58px}
.log-line.info .lv{color:var(--accent)}
.log-line.warning{background:color-mix(in srgb, var(--warn) 9%, transparent)}
.log-line.warning .lv{color:var(--warn)}
.log-line.error{background:color-mix(in srgb, var(--danger) 10%, transparent)}
.log-line.error .lv{color:var(--danger)}
.log-line.debug{color:var(--muted)}
.log-line.debug .lv{color:var(--muted)}
.log-line mark{background:var(--accent-soft);color:inherit;border-radius:3px}
.log-empty{padding:28px 20px;color:var(--muted);font-family:Figtree,system-ui,sans-serif;text-align:center}
.opt-body{flex:1;overflow:auto;padding:8px 20px 20px}
.opt-row{display:grid;grid-template-columns:1fr auto;gap:4px 16px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}
.opt-row:last-child{border-bottom:0}
.opt-row .ot{font-weight:600}
.opt-row .oh{grid-column:1;font-size:13px;color:var(--muted)}
.opt-row .oc{grid-row:1 / span 2;grid-column:2}
.opt-row select.input{width:auto;min-width:200px}
@media (max-width:520px){.opt-row{grid-template-columns:1fr}.opt-row .oc{grid-row:auto;grid-column:1;margin-top:6px}.opt-row .oh{grid-row:2}}
:root{--warn:#B7791F}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--warn:#E8B44F}}
:root[data-theme="dark"]{--warn:#E8B44F}

/* type chooser for new schedulers */
.chooser{position:fixed;inset:0;z-index:60;background:rgba(10,14,20,.45);display:grid;place-items:center;padding:16px}
.chooser[hidden]{display:none}
.chooser-box{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;width:min(460px,100%);box-shadow:0 20px 50px rgba(0,0,0,.25);display:grid;gap:10px}
.chooser-box h2{margin:0;font-size:18px}
.chooser-box p{margin:0 0 4px;color:var(--muted);font-size:14px}
.type-opt{display:grid;grid-template-columns:48px 1fr;gap:2px 14px;align-items:center;text-align:left;border:1.5px solid var(--line-strong);background:var(--surface);border-radius:14px;padding:12px 14px}
.type-opt:hover{border-color:var(--accent);background:var(--accent-soft)}
.type-opt svg{grid-row:span 2;color:var(--accent)}
.type-opt b{font-size:15.5px}
.type-opt span{font-size:13px;color:var(--muted)}
@media (max-width:560px){.chooser{align-items:end;padding:0}.chooser-box{border-radius:18px 18px 0 0;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}}

/* additions for the connected version */
.dot.off{background:var(--danger)}
.muted{color:var(--muted)}
.if-false{font-size:11px;font-weight:600;color:var(--muted);border:1px dashed var(--line-strong);border-radius:5px;padding:0 5px}
.cond-tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;font-size:13.5px}
.cond-result .ok{color:var(--ev-on)}
.tl-pin.alt button,.wk-pin.alt{border-style:dashed;opacity:.75}
.log-line .lm{white-space:pre-wrap;word-break:break-word}
.opt-row.wide{grid-template-columns:1fr}
.opt-row.wide .oc{grid-row:auto;grid-column:1;width:100%;margin-top:8px}
.opt-row code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.kelvin-range{background:linear-gradient(90deg,#FFB46B,#FFF4E5,#CFE0FF);border-radius:6px}
button:disabled{cursor:default}

</style>

  const APP_VERSION = '4.0.0';
  const VALID_DOMAINS = ['light','scene','switch','button','script','camera','climate','cover','vacuum','fan',

  const pad = n => String(n).padStart(2, '0');

    logLines.push('[' + ts + '] ' + level.padEnd(7) + ' ' + message);
  }
  function newId(){ let s = ''; for (let i = 0; i < 32; i++) s += Math.floor(Math.random()*16).toString(16); return s; }
  function parseTime(token){
    const t = String(token).trim().toLowerCase().replace(/ /g, '');
    let m = t.match(/^(sunrise|sunset)([+-]\d{1,3})?$/);

    m = t.match(/^([01]?\d|2[0-3])[:.]([0-5]\d)$/);

      if (!['on','off'].includes(item.action)) fail("Every event must be 'on' or 'off'");
      const time = parseTime(item.time || '');
      if (!time) fail("Invalid time '" + item.time + "': use hh:mm, sunrise±minutes or sunset±minutes");
      const weekdays = cleanDays(item.weekdays);
      if (!weekdays) fail('Every event needs at least one weekday');
      const extra = {}, src = item.extra && typeof item.extra === 'object' ? item.extra : {};
      if (item.action === 'on'){
        for (const [key, low, high, decimals] of [['brightness',1,100,0],['brightness_abs',1,255,0],['kelvin',1000,10000,0],
                                                  ['position',0,100,0],['fan',0,100,0],['temperature',5,40,1],['humidity',0,100,0]]){
          const v = src[key];
          if (v === undefined || v === null || v === '') continue;
          const n = Number(v);
          if (Number.isNaN(n)) fail("Invalid value '" + v + "' for " + key);
          const c = Math.max(low, Math.min(high, n));
          extra[key] = decimals ? Math.round(c*10)/10 : Math.round(c);
        }
        if ('brightness' in extra) delete extra.brightness_abs;
        const color = String(src.color || '').trim().replace(/^#/, '');
        if (color){
          if (!/^[0-9a-fA-F]{6}$/.test(color)) fail("Invalid color '" + color + "'");
          extra.color = '#' + color.toUpperCase();
          delete extra.kelvin;
        }
        if ('temperature' in extra && src.temperature_only) extra.temperature_only = true;
        const mode = String(src.hvac_mode || '').trim().toLowerCase();
        if (mode){
          if (!HVAC_MODES.includes(mode)) fail("Invalid climate mode '" + mode + "': use " + HVAC_MODES.join(', '));
          extra.hvac_mode = mode;
          delete extra.temperature_only;
        }
        let params = src.params;
        if (typeof params === 'string' && params.trim()){
          try { params = JSON.parse(params); } catch (err) { fail('Script parameters are not valid JSON'); }
        }
        if (params){
          if (typeof params !== 'object' || Array.isArray(params)) fail('Script parameters must be a JSON object');
          extra.params = params;
        }
      }
      const entry = { action:item.action, time:formatTime(...time), weekdays, extra,
                      if_condition:item.if_condition !== false, force:item.force === true };
      if (type === 'weekly' && weekdays.length > 1){
        for (const day of weekdays) entries.push({ ...JSON.parse(JSON.stringify(entry)), weekdays:day });
      } else entries.push(entry);
    }
    if (!entries.length) fail('Add at least one event');

    const base = { clock:0, sunrise:360, sunset:1080 };
    const key = e => { const [k, v] = parseTime(e.time); return base[k] + v; };
    if (type !== 'recurring') entries.sort((a, b) => a.weekdays < b.weekdays ? -1 : a.weekdays > b.weekdays ? 1 : key(a) - key(b));
    const enabled = raw.enabled === undefined ? true : typeof raw.enabled === 'boolean' ? raw.enabled : isTrue(raw.enabled);
    const scheduler = { version:APP_VERSION, id, name, type, enabled, entities,
                        condition:String(raw.condition || '').trim(), retry:raw.retry !== false };
    if (rule){
      const firstOn = entries.find(e => e.action === 'on');
      rule.extra = firstOn ? JSON.parse(JSON.stringify(firstOn.extra)) : {};
      scheduler.rule = rule;
    }
    scheduler.entries = entries;
    return scheduler;
  }

  function normalizeLayout(layout){
    const srcGroups = layout && typeof layout.groups === 'object' && layout.groups ? layout.groups : {};
    const srcOrder = layout && Array.isArray(layout.order) ? layout.order : [];
    const placed = new Set(), groups = {};
    for (const [gid, g] of Object.entries(srcGroups)){
      if (!/^g[0-9a-z]{1,40}$/.test(gid) || !g || typeof g !== 'object') continue;
      const children = [];
      for (const sid of g.children || []) if (schedulers.has(sid) && !placed.has(sid)){ children.push(sid); placed.add(sid); }
      groups[gid] = { name:String(g.name || '').trim().slice(0, 60) || 'Group', collapsed:!!g.collapsed, children };
    }
    const order = [];
    for (const item of srcOrder){
      if (groups[item] && !order.includes(item)) order.push(item);
      else if (schedulers.has(item) && !placed.has(item)){ order.push(item); placed.add(item); }
    }
    for (const gid of Object.keys(groups)) if (!order.includes(gid)) order.push(gid);
    const missing = [...schedulers.keys()].filter(sid => !placed.has(sid))
      .sort((a, b) => schedulers.get(a).name.toLowerCase().localeCompare(schedulers.get(b).name.toLowerCase()));
    return { version:APP_VERSION, order:[...missing, ...order], groups };
  }

  function cleanOptions(src, base){
    const o = { ...base };
    if ('max_retry' in src){ const n = parseInt(src.max_retry, 10); if (!Number.isNaN(n)) o.max_retry = Math.max(0, Math.min(5, n)); }
    for (const k of ['details_uncovered','mqtt_enabled','debug']) if (k in src) o[k] = typeof src[k] === 'string' ? isTrue(src[k]) : !!src[k];
    if ('notifier' in src) o.notifier = String(src.notifier || '').toLowerCase().replace(/[^a-z0-9_]/g, '');
    if ('excluded_entities' in src) o.excluded_entities = String(src.excluded_entities || '').toLowerCase().split('\n')
      .filter(l => l.trim()).map(l => l.replace(/[^a-z0-9_*.]/g, '')).join('\n');
    if (THEMES.includes(src.theme)) o.theme = src.theme;
    return o;
  }

  function state(){
    S.schedulers = [...schedulers.values()];
    return JSON.parse(JSON.stringify(S));
  }
  const bump = () => { S.version += 1; };

  /* ---------- the API ---------- */
  function handle(method, path, body){
    let m;
    if (method === 'GET' && path === 'api/state') return state();
    if (method === 'GET' && path === 'api/version') return { version:S.version, home_assistant:true };
    if (method === 'GET' && path === 'api/entities'){
      const patterns = (S.options.excluded_entities || '').split('\n').filter(Boolean)
        .map(p => new RegExp('^' + p.replace(/[.+?^${}()|[\]\\]/g, '\\$&').replace(/\*/g, '.*') + '$'));
      return DATA.entities.filter(e => !patterns.some(r => r.test(e.id)));
    }
    if (method === 'GET' && path === 'api/notifiers') return DATA.notifiers;
    if (method === 'GET' && path === 'api/log') return { lines:logLines.slice(-2000) };
    if (method === 'POST' && path === 'api/log/clear'){ logLines = []; log('INFO', 'Log cleared from the interface'); return { ok:true }; }
    if (method === 'POST' && path === 'api/template') return { result:'True' };
    if (method === 'POST' && path === 'api/schedulers'){
      const payload = body || {};
      const isNew = !schedulers.has(payload.id);
      if (isNew) payload.id = newId(); else payload.type = schedulers.get(payload.id).type;
      const s = normalizeScheduler(payload);
      schedulers.set(s.id, s);
      S.layout = normalizeLayout(S.layout);
      bump();
      log('INFO', '[' + s.name + '] ' + (isNew ? 'created' : 'saved') + ' from the interface');
      return { id:s.id, state:state() };
    }
    if (method === 'DELETE' && (m = path.match(/^api\/schedulers\/([0-9a-f]{32})$/))){
      const s = schedulers.get(m[1]);
      if (s){ schedulers.delete(m[1]); S.layout = normalizeLayout(S.layout); bump(); log('INFO', '[' + s.name + '] deleted from the interface'); }
      return { state:state() };
    }
    if (method === 'POST' && (m = path.match(/^api\/schedulers\/([0-9a-f]{32})\/enabled$/))){
      const s = schedulers.get(m[1]), on = !!(body || {}).enabled;
      if (s && s.enabled !== on){ s.enabled = on; bump(); log('INFO', '[' + s.name + '] ' + (on ? 'enabled' : 'disabled') + ' from the interface'); }
      return { state:state() };
    }
    if (method === 'POST' && (m = path.match(/^api\/groups\/([^/]+)\/enabled$/))){
      const g = S.layout.groups[m[1]], on = !!(body || {}).enabled;
      if (g){ for (const sid of g.children) if (schedulers.has(sid)) schedulers.get(sid).enabled = on;
              bump(); log('INFO', "Group '" + g.name + "' " + (on ? 'enabled' : 'disabled') + ' from the interface'); }
      return { state:state() };
    }
    if (method === 'POST' && path === 'api/layout'){ S.layout = normalizeLayout(body || {}); bump(); return { state:state() }; }
    if (method === 'POST' && path === 'api/options'){
      const before = { ...S.options };
      S.options = cleanOptions(body || {}, S.options);
      for (const [k, v] of Object.entries(S.options))
        if (before[k] !== v && k !== 'excluded_entities') log('INFO', 'Option ' + k + ' changed to ' + (v !== '' ? v : '(none)'));
      if (S.options.mqtt_enabled !== before.mqtt_enabled) S.status.mqtt = S.options.mqtt_enabled ? 'Connected to demo broker' : 'Disabled';
      bump();
      return { state:state() };
    }
    throw { status:404, message:'Not available in the demo' };
  }

  window.fetch = async function(url, options){
    options = options || {};
    const path = String(url).replace(/^\.?\//, '').split('?')[0];
    const method = (options.method || 'GET').toUpperCase();
    let body = null;
    try { body = options.body ? JSON.parse(options.body) : null; } catch (err) { body = null; }
    let status = 200, data;
    try { data = handle(method, path, body); }
    catch (err) { status = err.status || 500; data = { error:err.message || String(err) }; }
    return new Response(JSON.stringify(data), { status, headers:{ 'Content-Type':'application/json' } });
  };
  // No server to push changes: the page only changes through its own calls
  window.EventSource = function(){ return { close(){}, addEventListener(){} }; };
})();

<script>
/* SimpleScheduler 4 – web interface

'use strict';

  cover:['Open','Close'], valve:['Open','Close'], vacuum:['Start','Return home'], script:['Run','Stop'],
  automation:['Enable','Disable'], button:['Press',null], input_button:['Press',null], scene:['Activate',null]

  trash:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
  x:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  sunrise:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 18a5 5 0 0 0-10 0M12 2v7M4.2 10.2l1.4 1.4M1 18h2M21 18h2M18.4 11.6l1.4-1.4M23 22H1M8 6l4-4 4 4"/></svg>',
  sunset:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 18a5 5 0 0 0-10 0M12 9V2M4.2 10.2l1.4 1.4M1 18h2M21 18h2M18.4 11.6l1.4-1.4M23 22H1M16 5l-4 4-4-4"/></svg>',
  clock:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  globe:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>',
  zoomIn:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3M11 8v6M8 11h6"/></svg>',
  zoomOut:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3M8 11h6"/></svg>'
};

/* ============================================================
   State
   ============================================================ */
const app = {
  schedulers:{}, layout:{ order:[], groups:{} }, options:{}, sun:{}, status:{}, version:0, timeZone:'UTC',
  openDetails:{}, entities:[], entitiesLoaded:false, notifiers:null
};
let NOW = { day:1, minute:0 };       // weekday (1 = Monday) and minute of the day in Home Assistant's time zone
let seq = 0;
let ed = null;                       // editor state when the editor is open
let drag = null;                     // drag & drop state
let pendingReload = false;

function uid(){ seq++; return 'e' + seq + Math.random().toString(16).slice(2,6); }

function refreshNow(){
  try {
    const parts = new Intl.DateTimeFormat('en-GB', { timeZone:app.timeZone, weekday:'short', hour:'2-digit', minute:'2-digit', hourCycle:'h23' }).formatToParts(new Date());
    const part = type => parts.find(p => p.type === type).value;
    NOW = { day:WD.indexOf(part('weekday')) + 1, minute:Number(part('hour')) * 60 + Number(part('minute')) };
  } catch (err) {
    const d = new Date();
    NOW = { day:((d.getDay() + 6) % 7) + 1, minute:d.getHours() * 60 + d.getMinutes() };
  }
}

/* ============================================================
   Time, entries and text helpers
   ============================================================ */
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toMin(hhmm){ const [h,m] = hhmm.split(':').map(Number); return h*60 + m; }
function toHHMM(min){ min = ((min % 1440) + 1440) % 1440; return String(Math.floor(min/60)).padStart(2,'0') + ':' + String(min%60).padStart(2,'0'); }
function sunTime(kind){ return app.sun[kind] || (kind === 'sunrise' ? '06:00' : '18:00'); }

function parseTimeToken(str){
  str = String(str).trim().toLowerCase().replace(/\s/g, '');
  let m = str.match(/^(sunrise|sunset)([+-]\d{1,3})?$/);
  if (m) return { kind:m[1], offset:m[2] ? parseInt(m[2], 10) : 0 };
  m = str.match(/^([01]?\d|2[0-3])[:.]([0-5]\d)$/);
  if (m) return { kind:'clock', value:String(m[1]).padStart(2,'0') + ':' + m[2] };
  return null;
}
function timeToken(t){
  if (t.kind === 'clock') return t.value;
  return t.kind + (t.offset ? (t.offset > 0 ? '+' : '') + t.offset : '');
}
function minuteOf(t){
  if (t.kind === 'clock') return toMin(t.value);
  return Math.max(0, Math.min(1439, toMin(sunTime(t.kind)) + (t.offset || 0)));
}
function timeHTML(t){
  if (t.kind === 'clock') return esc(t.value);
  const off = t.offset ? ' ' + (t.offset > 0 ? '+' : '−') + Math.abs(t.offset) + 'm' : '';
  return ICON[t.kind] + (t.kind === 'sunrise' ? 'Sunrise' : 'Sunset') + off;
}
function daysSummary(days){
  const s = [...days].sort().join('');
  if (s === '1234567') return 'Every day';
  if (s === '12345') return 'Mon–Fri';
  if (s === '67') return 'Weekends';
  if (s === '') return 'No days';
  return [...s].map(d => WD[d-1]).join(', ');
}
function domainsOf(entityIds){ return [...new Set(entityIds.map(id => id.split('.')[0]))]; }
function actionWord(action, domains){
  if (domains.length === 1 && ACTION_WORDS[domains[0]]) {
    const w = ACTION_WORDS[domains[0]][action === 'on' ? 0 : 1];
    if (w) return w;
  }
  return action === 'on' ? 'On' : 'Off';
}
function entityName(id){ const e = app.entities.find(x => x.id === id); return e ? e.name : id; }

function extraHTML(x){
  const out = [];
  if (x.brightness !== undefined) out.push(x.brightness + '%');
  if (x.brightness_abs !== undefined) out.push('Bri ' + x.brightness_abs);
  if (x.color) out.push('<span class="swatch" style="background:' + esc(x.color) + '"></span>');
  if (x.kelvin !== undefined) out.push(x.kelvin + 'K');
  if (x.position !== undefined) out.push('Pos ' + x.position + '%');
  if (x.fan !== undefined) out.push('Fan ' + x.fan + '%');
  if (x.hvac_mode) out.push(esc(HVAC_LABELS[x.hvac_mode] || x.hvac_mode));
  if (x.temperature !== undefined) out.push(x.temperature + '°' + (x.temperature_only ? ' only' : ''));
  if (x.humidity !== undefined) out.push(x.humidity + '% RH');
  if (x.params) out.push('{…}');
  return out.join(' ');
}

function eventsForDay(entries, day){
  return entries.filter(e => e.weekdays.includes(String(day)))
                .map(e => ({ min:minuteOf(e.time), action:e.action, entry:e }))
                .sort((a,b) => a.min - b.min);
}
/* Events that only run when the condition is false are not drawn, to keep the bar readable */
function drawnEvents(entries, day){ return eventsForDay(entries, day).filter(ev => ev.entry.if_condition !== false); }

function bandsForDay(entries, day){
  // The week is a loop: at midnight the state is the one left by the last event of the previous days
  // (a scheduler with events on a single day starts from its own last event of the week before).
  // A day without events gets one band with that state. No events in the whole week: no bands.
  let current = null;
  for (let back = 1; back <= 7 && current === null; back++){
    const before = drawnEvents(entries, ((day - 1 - back) % 7 + 7) % 7 + 1);
    if (before.length) current = before[before.length-1].action;
  }
  if (current === null) return [];
  const events = drawnEvents(entries, day);
  let prev = 0;
  const segs = [];
  for (const ev of events){
    if (ev.min > prev) segs.push({ from:prev, to:ev.min, state:current });
    current = ev.action; prev = ev.min;
  }
  segs.push({ from:prev, to:1440, state:current });
  return segs;
}
function generateRecurring(rule){
  const entries = [];
  const from = toMin(rule.from), to = toMin(rule.to), every = Math.max(1, Number(rule.every) || 60);
  if (to < from) return entries;
  // the extra settings go on every "on" event, the condition choice on every event
  const ifCondition = rule.if_condition !== false;
  const mk = (action, minute) => ({ id:uid(), action, time:{ kind:'clock', value:toHHMM(minute) }, weekdays:rule.weekdays,
                                    extra:action === 'on' ? JSON.parse(JSON.stringify(rule.extra || {})) : {}, if_condition:ifCondition });
  for (let t = from; t <= to && entries.length < 600; t += every){
    if (rule.action === 'off') { entries.push(mk('off', t)); continue; }
    entries.push(mk('on', t));
    if (rule.action === 'pulse' && t + Number(rule.duration) < 1440) entries.push(mk('off', t + Number(rule.duration)));
  }
  return entries;
}

/* Conversion between the file format and the editor format (times as objects) */
function fromServer(s){
  return {
    id:s.id, name:s.name, type:s.type, enabled:s.enabled, entities:[...s.entities], condition:s.condition || '', retry:s.retry !== false,
    rule:s.rule ? { ...s.rule } : null,
    entries:(s.entries || []).map(e => ({ id:uid(), action:e.action, time:parseTimeToken(e.time) || { kind:'clock', value:'00:00' },
                                          weekdays:e.weekdays, extra:e.extra || {}, if_condition:e.if_condition !== false, force:e.force === true }))
  };
}
function toServer(d){
  return {
    id:d.id, name:d.name.trim(), type:d.type, enabled:d.enabled, entities:d.entities, condition:d.condition, retry:d.retry,
    rule:d.type === 'recurring' ? d.rule : undefined,
    entries:d.type === 'recurring' ? [] : d.entries.map(e => ({ action:e.action, time:timeToken(e.time), weekdays:e.weekdays, extra:e.extra, if_condition:e.if_condition, force:e.force === true }))
  };
}

/* Text format for preview and manual editing:  on sunset-15 12345 B70 C#FFB35C if:false force */
function settingsToText(action, x, ifCondition, force){
  // the optional settings at the end of a line: extra settings, if:false, force, then J{…} (always last)
  const parts = [];
  x = x || {};
  if (action === 'on'){
    if (x.brightness !== undefined) parts.push('B' + x.brightness);
    if (x.brightness_abs !== undefined) parts.push('BA' + x.brightness_abs);
    if (x.color) parts.push('C' + x.color);
    if (x.kelvin !== undefined) parts.push('K' + x.kelvin);
    if (x.position !== undefined) parts.push('P' + x.position);
    if (x.fan !== undefined) parts.push('F' + x.fan);
    if (x.hvac_mode) parts.push('M' + x.hvac_mode);
    if (x.temperature !== undefined) parts.push((x.temperature_only ? 'TO' : 'T') + x.temperature);
    if (x.humidity !== undefined) parts.push('H' + x.humidity);
  }
  if (ifCondition === false) parts.push('if:false');
  if (force) parts.push('force');
  if (action === 'on' && x.params) parts.push('J' + JSON.stringify(x.params));
  return parts;
}
function entryToLine(e){
  return [e.action, timeToken(e.time), e.weekdays, ...settingsToText(e.action, e.extra, e.if_condition, e.force)].join(' ');
}
function splitParams(text){
  // J{…} can contain spaces, so it is cut off before splitting the rest into tokens
  const j = text.search(/(^|\s)J\{/);
  if (j < 0) return { rest:text, params:null };
  const start = text[j] === 'J' ? j : j + 1;
  return { rest:text.slice(0, start).trim(), params:text.slice(start + 1) };
}
function lineToEntry(line){
  const { rest, params } = splitParams(line.trim());
  const tok = rest.split(/\s+/);
  const action = (tok[0] || '').toLowerCase();
  if (action !== 'on' && action !== 'off') throw 'must start with “on” or “off”';
  const time = parseTimeToken(tok[1] || '');
  if (!time) throw 'time must be hh:mm, sunrise±minutes or sunset±minutes';
  const days = tok[2] || '';
  if (!/^[1-7]{1,7}$/.test(days)) throw 'weekdays must be digits from 1 (Mon) to 7 (Sun)';
  const { extra, ifCondition, force } = parseSettings(tok.slice(3), params);
  if (action === 'off' && Object.keys(extra).length) throw 'extra settings work only with “on” events';
  return { id:uid(), action, time, weekdays:[...new Set(days)].sort().join(''), extra, if_condition:ifCondition, force };
}
function parseSettings(tokens, params){
  const extra = {};
  let ifCondition = true, force = false;
  for (const t of tokens){
    let m;
    if (t.toLowerCase() === 'if:false') { ifCondition = false; continue; }
    if (t.toLowerCase() === 'force') { force = true; continue; }
    if ((m = t.match(/^BA(\d{1,3})(?:\|(K?)([0-9a-f]{4,6}))?$/i)) || (m = t.match(/^B(\d{1,3})(?:\|(K?)([0-9a-f]{4,6}))?$/i))){
      // also accepts the version 3 forms B75|FFA500 and B20|K4700
      if (/^BA/i.test(t)) extra.brightness_abs = Math.min(255, +m[1]); else extra.brightness = Math.min(100, +m[1]);
      if (m[3] && m[2]) extra.kelvin = +m[3];
      else if (m[3]) { if (!/^[0-9a-f]{6}$/i.test(m[3])) throw 'invalid color “' + m[3] + '”'; extra.color = '#' + m[3].toUpperCase(); }
    }
    else if ((m = t.match(/^C#?([0-9a-f]{6})$/i))) extra.color = '#' + m[1].toUpperCase();
    else if ((m = t.match(/^K(\d{4,5})$/i))) extra.kelvin = +m[1];
    else if ((m = t.match(/^P(\d{1,3})$/i))) extra.position = Math.min(100, +m[1]);
    else if ((m = t.match(/^F(\d{1,3})$/i))) extra.fan = Math.min(100, +m[1]);
    else if ((m = t.match(/^TO(\d{1,2}(\.\d)?)$/i))) { extra.temperature = +m[1]; extra.temperature_only = true; }
    else if ((m = t.match(/^T(\d{1,2}(\.\d)?)$/i))) extra.temperature = +m[1];
    else if ((m = t.match(/^H(\d{1,3})$/i))) extra.humidity = Math.min(100, +m[1]);
    else if ((m = t.match(/^M([a-z_]+)$/i))){
      if (!HVAC_MODES.includes(m[1].toLowerCase())) throw 'unknown climate mode “' + m[1] + '” (use ' + HVAC_MODES.join(', ') + ')';
      extra.hvac_mode = m[1].toLowerCase();
    }
    else throw 'unknown setting “' + t + '”';
  }
  if (params !== null){
    let parsed;
    try { parsed = JSON.parse(params); } catch (err) { throw 'script parameters are not valid JSON'; }
    if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) throw 'script parameters must be a JSON object';
    extra.params = parsed;
  }
  return { extra, ifCondition, force };
}

/* ============================================================
   Server communication
   ============================================================ */
async function api(method, path, body){
  const res = await fetch(path, { method, headers:body !== undefined ? { 'Content-Type':'application/json' } : {}, body:body !== undefined ? JSON.stringify(body) : undefined });
  let data = null;
  try { data = await res.json(); } catch (err) { data = null; }
  if (!res.ok) throw new Error((data && data.error) || ('The request failed (' + res.status + ')'));
  return data;
}

function applyState(state){
  app.schedulers = Object.fromEntries(state.schedulers.map(s => [s.id, fromServer(s)]));
  app.layout = state.layout;
  app.options = state.options;
  app.sun = state.sun || {};
  app.status = state.status || {};
  app.version = state.version;
  app.timeZone = state.time_zone || 'UTC';
  applyTheme(app.options.theme);
  renderInfobar();
  renderList();
}

/* "light" and "dark" force a theme; "auto" leaves it to the device (prefers-color-scheme in the CSS) */
function applyTheme(theme){
  if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
  else delete document.documentElement.dataset.theme;
}

async function reloadState(){
  try { applyState(await api('GET', 'api/state')); } catch (err) { toast(err.message); }
}

/* Runs a request that changes data: the answer carries the new state */
async function mutate(promise, okMessage){
  try {
    const data = await promise;
    if (data && data.state) applyState(data.state);
    if (okMessage) toast(okMessage);
    return data;
  } catch (err) {
    toast(err.message);
    reloadState();
    return null;
  }
}

async function loadEntities(force){
  if (app.entitiesLoaded && !force) return;
  try { app.entities = await api('GET', 'api/entities'); app.entitiesLoaded = true; }
  catch (err) { app.entitiesLoaded = false; }
}

function saveLayout(message){ return mutate(api('POST', 'api/layout', app.layout), message); }

/* Server-Sent Events: the server sends a version number at every change (MQTT switch, midnight, another browser)
   and the page reloads its data. EventSource reconnects by itself when the add-on restarts */
const events = new EventSource('api/events');
events.onmessage = (event) => {
  let v;
  try { v = JSON.parse(event.data); } catch (err) { return; }
  const connected = !!v.home_assistant;
  if (connected !== !!app.status.home_assistant){ app.status.home_assistant = connected; renderInfobar(); }
  if (v.version !== app.version){
    if (ed || drag) pendingReload = true;
    else reloadState();
  }
};
setInterval(() => { if (!drag && !ed && !listEl.contains(document.activeElement)) { renderInfobar(); renderList(); } }, 60000);

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove('show'), 2600);
}

const listEl = document.getElementById('list');

function miniTimelineHTML(entries, day, showTicks){
  const bands = bandsForDay(entries, day);
  // a day without events shows its bar only when it stays on from the day before
  if (!eventsForDay(entries, day).length && !bands.some(s => s.state === 'on'))
    return '<div class="mini-empty">Nothing ' + (day === NOW.day ? 'today' : 'on ' + WD[day-1]) + '</div>';
  let html = '<div class="mini-track">';
  for (const s of bands) html += '<div class="seg ' + s.state + '" style="left:' + (s.from/14.4) + '%;width:' + ((s.to-s.from)/14.4) + '%"></div>';
  html += '</div>';
  if (day === NOW.day) html += '<div class="mini-now" style="left:' + (NOW.minute/14.4) + '%" title="Now"></div>';
  if (showTicks) html += '<div class="mini-ticks"><span style="left:0;transform:none">0</span><span style="left:25%">6</span><span style="left:50%">12</span><span style="left:75%">18</span><span style="right:0;transform:none">24</span></div>';
  return html;
}

function dayLinesHTML(entries, domains){
  // identical consecutive days are shown once, so a Mon–Fri plan takes one line
  const rows = [];
  for (let d = 1; d <= 7; d++){
    const evs = eventsForDay(entries, d);
    if (!evs.length) continue;
    const text = evs.map(ev => '<span class="ev-txt ' + ev.action + '"><b>' + actionWord(ev.action, domains) + '</b> ' + timeHTML(ev.entry.time) +
      (ev.entry.action === 'on' && extraHTML(ev.entry.extra) ? ' <span class="muted">' + extraHTML(ev.entry.extra) + '</span>' : '') +
      (ev.entry.if_condition === false ? ' <span class="if-false">if false</span>' : '') +
      (ev.entry.force ? ' <span title="Forced until the next event">' + ICON.lock + '</span>' : '') + '</span>').join('');
    const last = rows[rows.length-1];
    if (last && last.text === text && last.days[last.days.length-1] === d-1) last.days.push(d);
    else rows.push({ days:[d], text });
  }
  if (!rows.length) return '<span class="badges-empty">No events yet</span>';
  let html = '<div class="daylines">';
  for (const r of rows){
    const label = r.days.length === 7 ? 'Every day' : r.days.length > 2 ? WD[r.days[0]-1] + '–' + WD[r.days[r.days.length-1]-1] : r.days.map(d => WD[d-1]).join(', ');
    html += '<span class="d">' + label + '</span><span class="ev">' + r.text + '</span>';
  }
  return html + '</div>';
}

function schedulerRowHTML(s){
  const domains = domainsOf(s.entities);
  // with "always show details" on, the eye hides details instead of showing them
  const open = app.options.details_uncovered ? !app.openDetails[s.id] : !!app.openDetails[s.id];
  const typeName = { daily:'Daily', weekly:'Weekly', recurring:'Recurring' }[s.type];
  const entLabel = s.entities.length === 1 ? entityName(s.entities[0]) : s.entities.length + ' entities';
  let html = '<article class="sched' + (s.enabled ? '' : ' disabled') + '" data-id="' + s.id + '" data-kind="sched">' +
    '<div class="sched-main">' +
      '<button class="handle" aria-label="Drag to reorder ' + esc(s.name) + '">' + ICON.grip + '</button>' +
      '<div class="title"><span class="name">' + esc(s.name) + '</span>' +
        '<span class="meta"><span class="tag">' + typeName + '</span><span>' + esc(entLabel) + '</span>' + (s.condition ? '<span class="tag" title="Has a condition">if</span>' : '') + '</span></div>' +
      '<div class="mini" title="Today’s plan">' + miniTimelineHTML(s.entries, NOW.day, true) + '</div>' +
      '<div class="actions">' +
        '<button class="icon-btn' + (open ? ' active' : '') + '" data-act="details" aria-label="' + (open ? 'Hide' : 'Show') + ' details" aria-expanded="' + open + '">' + (open ? ICON.eyeOff : ICON.eye) + '</button>' +
        '<button class="icon-btn" data-act="edit" aria-label="Edit ' + esc(s.name) + '">' + ICON.pencil + '</button>' +
        '<label class="switch" title="' + (s.enabled ? 'Enabled' : 'Disabled') + '"><input type="checkbox" data-act="toggle"' + (s.enabled ? ' checked' : '') + ' aria-label="Enable ' + esc(s.name) + '"><span class="knob"></span></label>' +
      '</div>' +
    '</div>';
  if (open){
    html += '<div class="details"><div><h4>Entities</h4><div class="chips">' +
      s.entities.map(id => '<span class="chip">' + esc(entityName(id)) + ' <small>' + esc(id) + '</small></span>').join('') +
      '</div></div><div><h4>Schedule</h4>' + dayLinesHTML(s.entries, domains) + '</div>';
    if (s.condition) html += '<div><h4>Condition</h4><div class="code">' + esc(s.condition) + '</div></div>';
    if (!s.retry) html += '<div class="muted">No retry if an entity doesn’t respond.</div>';
    html += '</div>';
  }
  return html + '</article>';
}

function renderList(){
  refreshNow();
  if (!app.layout.order.length){
    listEl.innerHTML = '<div class="empty-state">No schedulers yet. Create one with New scheduler.</div>';
    return;
  }
  let html = '';
  for (const id of app.layout.order){
    if (app.layout.groups[id]){
      const g = app.layout.groups[id];
      const kids = g.children.map(c => app.schedulers[c]).filter(Boolean);
      const anyOn = kids.some(k => k.enabled);
      html += '<section class="group' + (g.collapsed ? ' collapsed' : '') + (anyOn ? '' : ' disabled') + '" data-id="' + id + '" data-kind="group">' +
        '<div class="group-head">' +
          '<button class="handle" aria-label="Drag group ' + esc(g.name) + '">' + ICON.grip + '</button>' +
          '<button class="icon-btn" data-act="collapse" aria-label="' + (g.collapsed ? 'Expand' : 'Collapse') + ' group" aria-expanded="' + !g.collapsed + '">' + ICON.chev + '</button>' +
          '<input class="group-name" value="' + esc(g.name) + '" aria-label="Group name" data-act="rename" maxlength="60">' +
          '<span class="group-count">' + kids.length + (kids.length === 1 ? ' scheduler' : ' schedulers') + '</span>' +
          '<button class="icon-btn danger" data-act="delgroup" aria-label="Delete group (schedulers are kept)" title="Delete group (schedulers are kept)">' + ICON.trash + '</button>' +
          '<label class="switch" title="Enable or disable every scheduler in this group"><input type="checkbox" data-act="togglegroup"' + (anyOn ? ' checked' : '') + (kids.length ? '' : ' disabled') + ' aria-label="Enable group ' + esc(g.name) + '"><span class="knob"></span></label>' +
        '</div>' +
        '<div class="group-body" data-container="' + id + '">' +
          (kids.length ? kids.map(schedulerRowHTML).join('') : '<div class="empty-hint">Drag schedulers here</div>') +
        '</div></section>';
    } else if (app.schedulers[id]) {
      html += schedulerRowHTML(app.schedulers[id]);
    }
  }
  listEl.innerHTML = html;
}

function renderInfobar(){
  const online = !!app.status.home_assistant;
  const sunNote = app.sun.approximated ? ' title="Approximated: the add-on started after sunset"' : '';
  document.getElementById('infobar').innerHTML =
    '<span><i class="dot' + (online ? '' : ' off') + '"></i>' + (online ? 'Connected to Home Assistant' : 'Home Assistant offline, events wait for it') + '</span>' +
    '<span style="color:var(--sunrise)"' + sunNote + '>' + ICON.sunrise + '<span class="muted">Sunrise ' + esc(sunTime('sunrise')) + '</span></span>' +
    '<span style="color:var(--sunset)"' + sunNote + '>' + ICON.sunset + '<span class="muted">Sunset ' + esc(sunTime('sunset')) + '</span></span>' +
    '<span>' + ICON.globe + esc(app.timeZone) + '</span>' +

    '<span class="legend"><span><i style="background:var(--on)"></i>On</span><span><i style="background:var(--off-soft);border:1px solid var(--line-strong)"></i>Off</span></span>';
}

/* ---------- list interactions ---------- */
const pendingGroupDelete = {};

listEl.addEventListener('click', ev => {
  const btn = ev.target.closest('[data-act]');
  if (!btn || btn.tagName === 'INPUT') return;
  const act = btn.dataset.act;
  const item = btn.closest('[data-kind]');
  const id = item && item.dataset.id;
  if (act === 'details'){ app.openDetails[id] = !app.openDetails[id]; renderList(); }
  if (act === 'edit') openEditor(id);
  if (act === 'collapse'){ app.layout.groups[id].collapsed = !app.layout.groups[id].collapsed; renderList(); saveLayout(); }
  if (act === 'delgroup'){
    if (!pendingGroupDelete[id]){
      pendingGroupDelete[id] = true;
      btn.style.color = 'var(--danger)'; btn.style.background = 'var(--danger-soft)';
      btn.setAttribute('aria-label', 'Click again to delete the group');
      toast('Click the bin again to delete the group. Its schedulers stay.');
      setTimeout(() => { delete pendingGroupDelete[id]; if (btn.isConnected){ btn.style.color = ''; btn.style.background = ''; } }, 3000);
      return;
    }
    const g = app.layout.groups[id], pos = app.layout.order.indexOf(id);
    app.layout.order.splice(pos, 1, ...g.children);
    delete app.layout.groups[id];
    renderList();
    saveLayout('Group deleted, schedulers moved out');
  }
});

listEl.addEventListener('change', ev => {
  const input = ev.target;
  const item = input.closest('[data-kind]');
  if (!item) return;
  const id = item.dataset.id;
  if (input.dataset.act === 'toggle'){
    const s = app.schedulers[id];
    s.enabled = input.checked;
    renderList();
    mutate(api('POST', 'api/schedulers/' + id + '/enabled', { enabled:input.checked }), s.name + (input.checked ? ' enabled' : ' disabled'));
  }
  if (input.dataset.act === 'togglegroup'){
    const g = app.layout.groups[id];
    g.children.forEach(c => { if (app.schedulers[c]) app.schedulers[c].enabled = input.checked; });
    renderList();
    mutate(api('POST', 'api/groups/' + id + '/enabled', { enabled:input.checked }), 'Group “' + g.name + '” ' + (input.checked ? 'enabled' : 'disabled'));
  }
  if (input.dataset.act === 'rename'){
    const name = input.value.trim();
    if (name && name !== app.layout.groups[id].name){ app.layout.groups[id].name = name; saveLayout(); }
    else input.value = app.layout.groups[id].name;
  }
});
listEl.addEventListener('keydown', ev => {

/* ---------- drag & drop with pointer events (mouse, touch, pen) ---------- */
listEl.addEventListener('pointerdown', ev => {
  const handle = ev.target.closest('.handle');
  if (!handle || ev.button > 0) return;
  ev.preventDefault();
  const el = handle.closest('[data-kind]');
  const rect = el.getBoundingClientRect();
  const ghost = el.cloneNode(true);
  ghost.classList.add('ghost');
  Object.assign(ghost.style, { width:rect.width + 'px', left:rect.left + 'px', top:rect.top + 'px' });
  document.body.appendChild(ghost);
  const ph = document.createElement('div');
  ph.className = 'placeholder';
  ph.style.height = Math.min(rect.height, 120) + 'px';
  el.after(ph);
  el.style.display = 'none';
  document.body.classList.add('dragging');
  drag = { el, ghost, ph, dy:ev.clientY - rect.top, kind:el.dataset.kind, id:el.dataset.id };
  document.addEventListener('pointermove', onDragMove);
  document.addEventListener('pointerup', onDragEnd);
  document.addEventListener('pointercancel', onDragEnd);
});

function onDragMove(ev){
  if (!drag) return;
  drag.ghost.style.top = (ev.clientY - drag.dy) + 'px';
  if (ev.clientY < 90) window.scrollBy(0, -12);
  if (ev.clientY > window.innerHeight - 50) window.scrollBy(0, 12);
  listEl.querySelectorAll('.drop-target').forEach(g => g.classList.remove('drop-target'));

  const under = document.elementFromPoint(ev.clientX, ev.clientY);
  if (!under) return;

  // a scheduler dropped on a group header goes inside that group (expanding it if collapsed)
  const head = under.closest('.group-head');
  if (drag.kind === 'sched' && head){
    const g = head.closest('.group');
    if (g.classList.contains('collapsed')){ g.classList.remove('collapsed'); app.layout.groups[g.dataset.id].collapsed = false; }
    g.classList.add('drop-target');
    const body = g.querySelector('.group-body');
    const hint = body.querySelector('.empty-hint');
    if (hint) hint.style.display = 'none';
    if (body.firstElementChild !== drag.ph) body.insertBefore(drag.ph, body.firstElementChild);
    return;
  }

  let container = under.closest('[data-container]');
  if (!container){
    if (!under.closest('main')) return;
    container = listEl;
  }
  // groups cannot be nested: hovering a group body places the dragged group before or after it
  if (drag.kind === 'group' && container !== listEl){
    const g = container.closest('.group');
    const r = g.getBoundingClientRect();
    const before = ev.clientY < r.top + r.height/2 ? g : g.nextElementSibling;
    if (drag.ph.nextElementSibling !== before) listEl.insertBefore(drag.ph, before);
    return;
  }
  if (container !== listEl){
    container.closest('.group').classList.add('drop-target');
    const hint = container.querySelector('.empty-hint');
    if (hint) hint.style.display = 'none';
  }
  const children = [...container.children].filter(c => c !== drag.ph && c !== drag.el && c.matches('.sched,.group'));
  let before = null;
  for (const c of children){
    const r = c.getBoundingClientRect();
    if (ev.clientY < r.top + r.height/2){ before = c; break; }
  }
  if (drag.ph.parentNode === container && drag.ph.nextElementSibling === before) return;
  if (before) container.insertBefore(drag.ph, before); else container.appendChild(drag.ph);
}

function onDragEnd(){
  if (!drag) return;
  document.removeEventListener('pointermove', onDragMove);
  document.removeEventListener('pointerup', onDragEnd);
  document.removeEventListener('pointercancel', onDragEnd);
  const container = drag.ph.parentNode;
  const target = container.dataset.container;
  const siblings = [...container.children].filter(c => c === drag.ph || (c !== drag.el && c.matches('.sched,.group')));
  const index = siblings.indexOf(drag.ph);

  const rootPos = app.layout.order.indexOf(drag.id);
  if (rootPos >= 0) app.layout.order.splice(rootPos, 1);
  for (const g of Object.values(app.layout.groups)){
    const p = g.children.indexOf(drag.id);
    if (p >= 0) g.children.splice(p, 1);
  }
  if (target === 'root' || !app.layout.groups[target]) app.layout.order.splice(index, 0, drag.id);
  else app.layout.groups[target].children.splice(index, 0, drag.id);

  drag.ghost.remove();
  document.body.classList.remove('dragging');
  drag = null;
  renderList();
  saveLayout();
  if (pendingReload){ pendingReload = false; }
}

function emptyForm(){
  return {
    action:'on', mode:'clock', time:'07:00', offset:0, days:'1234567', ifCondition:true, force:false,
    f:{ brightness:{on:false, mode:'pct', value:60}, color:{on:false, mode:'rgb', value:'#FFB35C', kelvin:4000},
        position:{on:false, value:50}, fan:{on:false, value:50}, temperature:{on:false, value:21, only:false}, hvac:{on:false, value:'heat'},
        humidity:{on:false, value:50}, params:{on:false, value:'{\n  "field": "value"\n}'} }
  };
}

async function openEditor(id, newType){
  const draft = id ? JSON.parse(JSON.stringify(app.schedulers[id]))
                   : { id:null, name:'', type:newType || 'daily', enabled:true, entities:[], condition:'', retry:true, entries:[], rule:null };
  draft.rule = { from:'06:00', to:'20:00', every:60, action:'pulse', duration:10, weekdays:'1234567', extra:{}, if_condition:true, force:false, ...(draft.rule || {}) };
  refreshNow();
  ed = { draft, isNew:!id, day:NOW.day, zoom:1, editingId:null, textTab:'preview', form:draft.type === 'recurring' ? formFromRule(draft.rule) : emptyForm(),
         manualText:null, manualErr:'', entQuery:'', entOpen:false, delArmed:false, condResult:'' };
  document.getElementById('ed-title').textContent = (id ? 'Edit ' : 'New ') + draft.type + ' scheduler';
  document.getElementById('ed-err').textContent = '';
  renderEditor();
  editorEl.classList.add('open');
  editorEl.scrollTop = 0;
  document.body.style.overflow = 'hidden';
  if (!id) setTimeout(() => { const n = edBody.querySelector('#f-name'); if (n) n.focus(); }, 50);
  if (!app.entitiesLoaded){ await loadEntities(); if (ed) renderPicker(); }
}

function closeEditor(){
  editorEl.classList.remove('open');
  document.body.style.overflow = '';
  ed = null;
  if (pendingReload){ pendingReload = false; reloadState(); }
}

function renderEditor(){
  const d = ed.draft;
  const typeHelp = {
    daily:'Events repeat on the weekdays you choose. Each event can have its own days.',
    weekly:'Every day of the week has its own list of events.',
    recurring:'Repeat an action at a fixed interval between two times.'
  }[d.type];
  const typeName = { daily:'Daily', weekly:'Weekly', recurring:'Recurring' }[d.type];
  edBody.innerHTML =
    '<div class="card">' +
      '<div class="field"><label for="f-name">Name</label><input id="f-name" class="input name-input" value="' + esc(d.name) + '" placeholder="e.g. Evening lamp" autocomplete="off" maxlength="100"></div>' +
      '<p class="type-help" style="margin-top:12px"><span class="tag">' + typeName + '</span> ' + typeHelp + '</p>' +
      '<label class="checkline" style="margin-top:12px"><input type="checkbox" id="f-retry"' + (d.retry ? ' checked' : '') + '>Retry when an entity doesn’t respond (up to ' + app.options.max_retry + ' times, set in Options)</label>' +
    '</div>' +
    '<div class="card"><h3>Entities <span class="sub">What this scheduler controls</span></h3><div class="picker" id="picker"></div></div>' +
    '<div class="card"><h3>Condition <span class="sub">Optional template that must render True</span></h3>' +
      '<textarea class="input" id="f-cond" rows="3" placeholder="{{ states(\'switch.my_switch\') | replace(\'unavailable\', \'false\') | bool }}" spellcheck="false">' + esc(d.condition) + '</textarea>' +
      '<div class="cond-tools"><button class="btn small" id="cond-test">Test condition</button><span id="cond-result" class="cond-result">' + ed.condResult + '</span></div>' +
      '<p class="syntax">Leave it empty to always run. Each event can run when the condition is true (the usual case) or when it is false.</p></div>' +
    '<div id="ed-view" style="display:grid;gap:16px"></div>' +
    (ed.isNew ? '' : '<div class="card-actions"><button class="btn danger" id="ed-delete">' + ICON.trash + ' Delete scheduler</button></div>');
  renderPicker();
  renderEditorView();
}

function renderPicker(){
  const d = ed.draft;
  const q = ed.entQuery.toLowerCase();
  const matches = app.entities.filter(e => !d.entities.includes(e.id) && (e.id.includes(q) || e.name.toLowerCase().includes(q))).slice(0, 40);
  const box = document.getElementById('picker');
  const hadFocus = document.activeElement && document.activeElement.id === 'f-ent';
  let dropdown = '';
  if (ed.entOpen){
    dropdown = '<div class="dropdown" id="ent-dd">' +
      (!app.entitiesLoaded ? '<div class="none">Home Assistant is not reachable: the entity list is not available.</div>'
       : matches.length ? matches.map(e => '<button data-add-ent="' + esc(e.id) + '">' + esc(e.name) + '<small>' + esc(e.id) + '</small></button>').join('')
       : '<div class="none">No matching entities</div>') + '</div>';
  }
  box.innerHTML =
    (d.entities.length ? '<div class="chips">' + d.entities.map(id =>
        '<span class="chip">' + esc(entityName(id)) + ' <small>' + esc(id.split('.')[0]) + '</small><button class="x" data-rm-ent="' + esc(id) + '" aria-label="Remove ' + esc(id) + '">' + ICON.x + '</button></span>').join('') + '</div>' : '') +
    '<input class="input" id="f-ent" placeholder="Search entities by name or ID" autocomplete="off" value="' + esc(ed.entQuery) + '">' + dropdown;
